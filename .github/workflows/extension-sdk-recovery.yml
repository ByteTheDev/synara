# Branch-only recovery. Remove from the final application change set.
name: Extension SDK recovery
on:
  push:
    branches: [feat/synara-code-oss-extensions]
    paths: [.github/workflows/extension-sdk-recovery.yml]
permissions:
  contents: read
jobs:
  sdk:
    if: github.repository == 'Emanuele-web04/synara'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 0b387ea32a9cf829cac7ae2e2de3a7587d10c294
      - uses: ./.github/actions/setup-workspace
        with:
          electron: 'true'
      - name: Archive dependencies in bounded parts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/synara-offline"
          tar -I 'zstd -T0 -3' -cf "$RUNNER_TEMP/synara-offline/modules.tar.zst" node_modules apps/*/node_modules packages/*/node_modules scripts/node_modules
          cd "$RUNNER_TEMP/synara-offline"
          sha256sum modules.tar.zst > SHA256SUMS
          split --bytes=400M --numeric-suffixes=0 --suffix-length=2 modules.tar.zst modules.part-
          sha256sum modules.part-* >> SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: synara-offline-modules-part-00
          path: |
            ${{ runner.temp }}/synara-offline/modules.part-00
            ${{ runner.temp }}/synara-offline/SHA256SUMS
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: synara-offline-modules-part-01
          path: ${{ runner.temp }}/synara-offline/modules.part-01
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: synara-offline-modules-part-02
          path: ${{ runner.temp }}/synara-offline/modules.part-02
          compression-level: 0
          retention-days: 2
          if-no-files-found: warn
