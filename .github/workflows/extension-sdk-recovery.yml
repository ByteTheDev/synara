# Branch-only execution bridge. Temporary assembly files never enter the application candidate.
name: Extension candidate validation
on:
  push:
    branches: [feat/synara-code-oss-extensions]
    paths: [.github/workflows/extension-sdk-recovery.yml]
permissions:
  contents: read
concurrency:
  group: extension-candidate-${{ github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_BASE: 3a8dea36f3e04744f3143d895936302078103c48
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.objects.outputs.candidate }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_BASE }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Assemble native editor integration
        run: node scripts/finish-extension-integration.mjs
      - name: Format the explicit change set
        run: |
          ./node_modules/.bin/oxfmt apps/server/src/extensions \
            apps/server/src/platform/extensionHostSandbox.ts apps/server/src/platform/extensionHostSandbox.test.ts \
            apps/server/src/wsRpc.ts apps/web/src/wsNativeApi.ts \
            apps/web/src/components/codeEditor/editorExtensionBridge.ts \
            apps/web/src/components/codeEditor/editorExtensionBridge.browser.tsx \
            apps/web/src/components/codeEditor/EditorExtensionInteraction.tsx \
            apps/web/src/components/codeEditor/MonacoEditorSurface.tsx \
            apps/web/src/components/settings/EditorExtensionsSettingsPanel.tsx \
            packages/contracts/src/editorExtensionRuntime.ts packages/contracts/src/index.ts \
            packages/contracts/src/ipc.ts packages/contracts/src/rpc.ts packages/contracts/src/ws.ts scripts/build-code-oss-host.mjs
      - name: Store normalized candidate objects without updating refs
        id: objects
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFile,appendFile} from 'node:fs/promises';
          async function api(endpoint,body) {
            const response=await fetch(`https://api.github.com/repos/Emanuele-web04/synara/${endpoint}`,{
              method:body?'POST':'GET',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
              ...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(30000),
            });
            if(!response.ok)throw new Error(`${endpoint}: ${response.status} ${await response.text()}`);
            return response.json();
          }
          const files=execFileSync('git',['diff','--name-only','-z','HEAD'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const allowed=new Set(['apps/server/src/wsRpc.ts','apps/web/src/wsNativeApi.ts','apps/web/src/components/settings/EditorExtensionsSettingsPanel.tsx','scripts/build-code-oss-host.mjs']);
          const tree=[];
          for(const file of files){
            if(!allowed.has(file)&&!file.startsWith('apps/server/src/extensions/')&&!file.startsWith('apps/web/src/components/codeEditor/')&&!file.startsWith('apps/server/src/platform/extensionHostSandbox')&&!file.startsWith('packages/contracts/src/'))throw new Error(`Unexpected edit ${file}`);
            const blob=await api('git/blobs',{content:await readFile(file,'utf8'),encoding:'utf-8'});
            tree.push({path:file,mode:'100644',type:'blob',sha:blob.sha});
          }
          for(const file of ['scripts/assemble-extension-runtime.mjs','scripts/repair-extension-candidate.mjs','scripts/wire-extension-editor.mjs','scripts/finish-extension-integration.mjs'])tree.push({path:file,mode:'100644',type:'blob',sha:null});
          const base=await api(`git/commits/${process.env.CANDIDATE_BASE}`);
          const result=await api('git/trees',{base_tree:base.tree.sha,tree});
          const identity={name:'Commander Chara',email:'249489759+cmdr-chara@users.noreply.github.com'};
          const commit=await api('git/commits',{message:'feat(extensions): integrate native editor commands, formatting and guarded document edits',tree:result.sha,parents:[process.env.PARENT_SHA,process.env.CANDIDATE_BASE],author:identity,committer:identity});
          console.log('CANDIDATE_COMMIT',commit.sha);console.log('CANDIDATE_TREE',result.sha);
          console.log('NORMALIZED_FILES',JSON.stringify(tree));
          await appendFile(process.env.GITHUB_OUTPUT,`candidate=${commit.sha}\n`);
          NODE
  validate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Integrated typecheck
        run: bun run typecheck > "$RUNNER_TEMP/types.log" 2>&1 || { grep -E 'error TS|error:' "$RUNNER_TEMP/types.log"; exit 1; }
      - name: Required format, lint and process ownership checks
        if: ${{ !cancelled() }}
        run: |
          bun run fmt:check
          bun run lint > "$RUNNER_TEMP/lint.log" 2>&1 || { tail -60 "$RUNNER_TEMP/lint.log"; exit 1; }
          bun run windows-runtime:check
      - name: Package and sandbox boundaries
        if: ${{ !cancelled() }}
        run: bun run --cwd apps/server test src/extensions/manifest.test.ts src/extensions/vsix.test.ts src/extensions/openVsx.test.ts src/platform/extensionHostSandbox.test.ts
      - name: Install browser
        run: cd apps/web && ./node_modules/.bin/playwright install chromium
      - name: Native editor bridge regressions
        run: bun run --cwd apps/web test:browser:ci -- --project=components src/components/codeEditor/editorExtensionBridge.browser.tsx
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: native-extension-browser-evidence
          path: apps/web/src/components/codeEditor/__screenshots__
          if-no-files-found: ignore
          retention-days: 3
  upstream-host:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Prepare verified upstream source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/code-oss"
          cd "$RUNNER_TEMP/code-oss"
          curl --fail --silent --show-error --location --max-time 90 'https://codeload.github.com/microsoft/vscode/tar.gz/7debcd0e2acdea1c52de81bf9ee1620444407dda' -o source.tar.gz
          echo '75b125b51f7258dbbd4cafb25ae658ea0edac4f2f5ad2ff9f61aeb8e1f99ee5e  source.tar.gz' | sha256sum -c -
          tar -xzf source.tar.gz
          cd vscode-7debcd0e2acdea1c52de81bf9ee1620444407dda
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/upstream-install.log" 2>&1 || { tail -40 "$RUNNER_TEMP/upstream-install.log"; exit 1; }
          mkdir -p "$RUNNER_TEMP/code-oss-builder"
          cd "$RUNNER_TEMP/code-oss-builder"
          npm init -y >/dev/null
          npm install --ignore-scripts --package-lock=false --no-audit --no-fund esbuild@0.25.12
      - name: Build pinned headless host
        env:
          SYNARA_CODE_OSS_SOURCE: ${{ runner.temp }}/code-oss/vscode-7debcd0e2acdea1c52de81bf9ee1620444407dda
          SYNARA_CODE_OSS_OUTPUT: ${{ runner.temp }}/code-oss-runtime
          SYNARA_ESBUILD_MODULE: ${{ runner.temp }}/code-oss-builder/node_modules/esbuild/lib/main.js
        run: node scripts/build-code-oss-host.mjs
      - name: Actual Prettier activation and formatting
        env:
          SYNARA_TEST_CODE_OSS_HOST: ${{ runner.temp }}/code-oss-runtime/extension-host.mjs
        run: bun run --cwd apps/server test src/extensions/realHost.test.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: code-oss-candidate-runtime
          path: ${{ runner.temp }}/code-oss-runtime
          if-no-files-found: warn
          retention-days: 3
