# Branch-only recovery. Remove from the final application change set.
name: Extension SDK recovery
on:
  push:
    branches: [feat/synara-code-oss-extensions]
    paths: [.github/workflows/extension-sdk-recovery.yml]
permissions:
  contents: read
jobs:
  fixtures:
    if: github.repository == 'Emanuele-web04/synara'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - name: Download real Open VSX packages and record immutable evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/extension-fixtures"
          cd "$RUNNER_TEMP/extension-fixtures"
          node --input-type=module <<'NODE'
          import {writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const evidence=[];
          for (const [publisher,name] of [['dbaeumer','vscode-eslint'],['redhat','vscode-yaml'],['ms-python','debugpy'],['ms-vscode','js-debug']]) {
            try {
              const url=`https://open-vsx.org/api/${publisher}/${name}/latest`;
              const response=await fetch(url,{signal:AbortSignal.timeout(30000)});
              if(!response.ok) throw new Error(`Metadata HTTP ${response.status}`);
              const metadata=await response.json();
              const download=await fetch(metadata.files.download,{signal:AbortSignal.timeout(90000)});
              if(!download.ok) throw new Error(`VSIX HTTP ${download.status}`);
              const bytes=Buffer.from(await download.arrayBuffer());
              if(bytes.length>150*1024*1024) throw new Error('VSIX fixture too large');
              const file=`${publisher}.${name}-${metadata.version}.vsix`;
              await writeFile(file,bytes);
              await writeFile(`${file}.metadata.json`,JSON.stringify(metadata,null,2));
              evidence.push({id:`${publisher}.${name}`,version:metadata.version,url:metadata.files.download,file,bytes:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex')});
            } catch(error) { evidence.push({id:`${publisher}.${name}`,error:String(error)}); }
          }
          await writeFile('evidence.json',JSON.stringify(evidence,null,2));
          console.log(JSON.stringify(evidence,null,2));
          NODE
          mkdir eslint-workspace && cd eslint-workspace
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund eslint@9.39.1
          cd ..
          tar -I 'zstd -T0 -3' -cf eslint-workspace.tar.zst eslint-workspace
          rm -rf eslint-workspace
          sha256sum *.vsix *.tar.zst > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: authentic-extension-fixtures
          path: ${{ runner.temp }}/extension-fixtures
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
