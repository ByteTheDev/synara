# Branch-only recovery. Remove from the final application change set.
name: Extension SDK recovery
on:
  push:
    branches: [feat/synara-code-oss-extensions]
    paths: [.github/workflows/extension-sdk-recovery.yml]
permissions:
  contents: read
jobs:
  sdk:
    if: github.repository == 'Emanuele-web04/synara'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 0b387ea32a9cf829cac7ae2e2de3a7587d10c294
      - uses: ./.github/actions/setup-workspace
        with:
          electron: 'true'
      - name: Preserve exact source, dependencies and tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/synara-offline/source" "$RUNNER_TEMP/synara-offline/tools" "$RUNNER_TEMP/synara-offline/modules"
          git archive --format=tar HEAD | zstd -T0 -3 -o "$RUNNER_TEMP/synara-offline/source/source.tar.zst"
          git rev-parse HEAD > "$RUNNER_TEMP/synara-offline/source/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/synara-offline/source/tree.txt"
          tar -I 'zstd -T0 -3' -cf "$RUNNER_TEMP/synara-offline/modules/modules.tar.zst" node_modules apps/*/node_modules packages/*/node_modules scripts/node_modules
          cp "$(command -v node)" "$RUNNER_TEMP/synara-offline/tools/node"
          cp "$(command -v bun)" "$RUNNER_TEMP/synara-offline/tools/bun"
          cd "$RUNNER_TEMP/synara-offline"
          sha256sum source/source.tar.zst modules/modules.tar.zst tools/node tools/bun > SHA256SUMS
      - name: Resolve headless upstream build dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/extension-sdk"
          cd "$RUNNER_TEMP/extension-sdk"
          curl --fail --silent --show-error --max-time 90 'https://codeload.github.com/microsoft/vscode/tar.gz/7debcd0e2acdea1c52de81bf9ee1620444407dda' -o code-oss.tar.gz
          echo '75b125b51f7258dbbd4cafb25ae658ea0edac4f2f5ad2ff9f61aeb8e1f99ee5e  code-oss.tar.gz' | sha256sum -c -
          tar -xzf code-oss.tar.gz
          cd vscode-7debcd0e2acdea1c52de81bf9ee1620444407dda
          npm install --omit=dev --ignore-scripts --package-lock=false --no-audit --no-fund
          cd ..
          mkdir builder
          cd builder
          npm init -y >/dev/null
          npm install --ignore-scripts --package-lock=false --no-audit --no-fund esbuild@0.25.12 yauzl@3.4.0 semver@7.7.4
          cd ..
          tar -I 'zstd -T0 -3' -cf extension-sdk.tar.zst vscode-*/node_modules builder
          sha256sum extension-sdk.tar.zst > SDK.sha256
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: synara-offline-source-tools
          path: |
            ${{ runner.temp }}/synara-offline/source
            ${{ runner.temp }}/synara-offline/tools
            ${{ runner.temp }}/synara-offline/SHA256SUMS
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: synara-offline-modules-linux-x64
          path: ${{ runner.temp }}/synara-offline/modules
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: code-oss-offline-build-sdk
          path: |
            ${{ runner.temp }}/extension-sdk/extension-sdk.tar.zst
            ${{ runner.temp }}/extension-sdk/SDK.sha256
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
