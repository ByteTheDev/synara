# Temporary execution bridge. Candidate objects never update repository refs.
name: Extension candidate validation
on:
  push:
    branches: [feat/synara-code-oss-extensions]
    paths: [.github/workflows/extension-sdk-recovery.yml]
permissions:
  contents: read
concurrency:
  group: extension-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.objects.outputs.candidate }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 9a3803897ca4d0a617148f48a14184bf4ab61e42
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Repair the identified integration defects
        run: node scripts/repair-extension-candidate.mjs
      - name: Format only changed application files
        run: |
          ./node_modules/.bin/oxfmt apps/server/src/extensions \
            apps/web/src/components/settings/EditorExtensionsSettingsPanel.tsx \
            scripts/build-code-oss-host.mjs
      - name: Preserve normalized objects for review without publishing a ref
        id: objects
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFile, appendFile } from 'node:fs/promises';
          const candidate = '9a3803897ca4d0a617148f48a14184bf4ab61e42';
          async function api(endpoint, body) {
            const response = await fetch(`https://api.github.com/repos/Emanuele-web04/synara/${endpoint}`, {
              method: body ? 'POST' : 'GET',
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
              ...(body ? { body: JSON.stringify(body) } : {}), signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`${endpoint}: ${response.status} ${await response.text()}`);
            return response.json();
          }
          const changes = execFileSync('git', ['diff', '--name-only', '-z', 'HEAD'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const elements = [];
          for (const file of changes) {
            if (!file.startsWith('apps/server/src/extensions/') && ![
              'apps/web/src/components/settings/EditorExtensionsSettingsPanel.tsx', 'scripts/build-code-oss-host.mjs',
            ].includes(file)) throw new Error(`Unexpected modification: ${file}`);
            const blob = await api('git/blobs', { content: await readFile(file, 'utf8'), encoding: 'utf-8' });
            elements.push({ path: file, mode: '100644', type: 'blob', sha: blob.sha });
          }
          elements.push({ path: 'scripts/repair-extension-candidate.mjs', mode: '100644', type: 'blob', sha: null });
          const base = await api(`git/commits/${candidate}`);
          const tree = await api('git/trees', { base_tree: base.tree.sha, tree: elements });
          const commit = await api('git/commits', {
            message: 'feat(extensions): connect real Code-OSS host and formatter acceptance',
            tree: tree.sha, parents: [process.env.PARENT_SHA, candidate],
            author: { name: 'Commander Chara', email: '249489759+cmdr-chara@users.noreply.github.com' },
            committer: { name: 'Commander Chara', email: '249489759+cmdr-chara@users.noreply.github.com' },
          });
          console.log('CANDIDATE_COMMIT', commit.sha);
          console.log('CANDIDATE_TREE', tree.sha);
          console.log(execFileSync('git', ['diff', '--stat'], { encoding: 'utf8' }));
          await appendFile(process.env.GITHUB_OUTPUT, `candidate=${commit.sha}\n`);
          NODE
  validate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Typecheck integrated web and server changes
        run: |
          set -o pipefail
          bun run typecheck > "$RUNNER_TEMP/typecheck.log" 2>&1 || { tail -100 "$RUNNER_TEMP/typecheck.log"; exit 1; }
          tail -12 "$RUNNER_TEMP/typecheck.log"
      - name: Targeted package integrity tests
        if: ${{ !cancelled() }}
        run: bun run --cwd apps/server test src/extensions/manifest.test.ts src/extensions/vsix.test.ts
      - name: Formatter and lint
        if: ${{ !cancelled() }}
        run: |
          bun run fmt:check
          bun run lint > "$RUNNER_TEMP/lint.log" 2>&1 || { tail -80 "$RUNNER_TEMP/lint.log"; exit 1; }
      - name: Process ownership boundary
        if: ${{ !cancelled() }}
        run: bun run windows-runtime:check
  upstream-host:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Verify and prepare immutable upstream source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/code-oss"
          cd "$RUNNER_TEMP/code-oss"
          curl --fail --silent --show-error --location --max-time 90 \
            'https://codeload.github.com/microsoft/vscode/tar.gz/7debcd0e2acdea1c52de81bf9ee1620444407dda' -o source.tar.gz
          echo '75b125b51f7258dbbd4cafb25ae658ea0edac4f2f5ad2ff9f61aeb8e1f99ee5e  source.tar.gz' | sha256sum -c -
          tar -xzf source.tar.gz
          cd vscode-7debcd0e2acdea1c52de81bf9ee1620444407dda
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/upstream-install.log" 2>&1 || { tail -60 "$RUNNER_TEMP/upstream-install.log"; exit 1; }
          mkdir -p "$RUNNER_TEMP/code-oss-builder"
          cd "$RUNNER_TEMP/code-oss-builder"
          npm init -y >/dev/null
          npm install --ignore-scripts --package-lock=false --no-audit --no-fund esbuild@0.25.12
      - name: Build only the headless extension host
        env:
          SYNARA_CODE_OSS_SOURCE: ${{ runner.temp }}/code-oss/vscode-7debcd0e2acdea1c52de81bf9ee1620444407dda
          SYNARA_CODE_OSS_OUTPUT: ${{ runner.temp }}/code-oss-runtime
          SYNARA_ESBUILD_MODULE: ${{ runner.temp }}/code-oss-builder/node_modules/esbuild/lib/main.js
        run: node scripts/build-code-oss-host.mjs
      - name: Real Prettier VSIX activation, dirty document formatting and cleanup
        env:
          SYNARA_TEST_CODE_OSS_HOST: ${{ runner.temp }}/code-oss-runtime/extension-host.mjs
        run: bun run --cwd apps/server test src/extensions/realHost.test.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: code-oss-candidate-runtime
          path: ${{ runner.temp }}/code-oss-runtime
          if-no-files-found: warn
          retention-days: 3
