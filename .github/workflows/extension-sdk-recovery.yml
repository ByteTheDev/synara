# Temporary assembly only. Publication is performed by the authorized GitHub connector.
name: Extension publication assembly
on:
  push:
    branches: [feat/synara-code-oss-extensions]
    paths: [.github/workflows/extension-sdk-recovery.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 66a967048f9f37d2412807e15d191f9ac442f6b1
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: node scripts/prepare-extension-ui-isolation.mjs
      - name: Format only the publication change set
        run: |
          ./node_modules/.bin/oxfmt apps/server/src/extensions/extensionRuntime.ts apps/server/src/extensions/realRuntime.test.ts \
            apps/web/e2e/editorExtensions.e2e.ts apps/web/e2e/editorExtensionDebug.e2e.ts \
            apps/web/e2e/extensionAcceptanceControls.ts apps/web/playwright.extensions.config.ts \
            scripts/build-code-oss-host.mjs scripts/code-oss-notices.mjs docs/editor/extensions.md \
            .github/actions/build-code-oss/action.yml .github/workflows/code-oss-extension-acceptance.yml
      - name: Export normalized blobs without creating commits or updating refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFile,writeFile} from 'node:fs/promises';
          const allowed=new Set(['apps/server/src/extensions/extensionRuntime.ts','apps/server/src/extensions/realRuntime.test.ts',
            'apps/web/e2e/editorExtensions.e2e.ts','apps/web/e2e/editorExtensionDebug.e2e.ts','apps/web/e2e/extensionAcceptanceControls.ts',
            'apps/web/playwright.extensions.config.ts','scripts/build-code-oss-host.mjs','scripts/code-oss-notices.mjs',
            'docs/editor/extensions.md','.github/actions/build-code-oss/action.yml','.github/workflows/code-oss-extension-acceptance.yml']);
          const files=new Set([...execFileSync('git',['diff','--name-only','-z','HEAD'],{encoding:'utf8'}).split('\0').filter(Boolean),'apps/web/e2e/extensionAcceptanceControls.ts']);
          const tree=[];
          for(const file of files){
            if(!allowed.has(file))throw new Error(`Unexpected edit ${file}`);
            const response=await fetch('https://api.github.com/repos/Emanuele-web04/synara/git/blobs',{
              method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
              body:JSON.stringify({content:await readFile(file,'utf8'),encoding:'utf-8'}),signal:AbortSignal.timeout(30000),
            });
            if(!response.ok)throw new Error(`Blob ${file}: ${response.status} ${await response.text()}`);
            tree.push({path:file,mode:'100644',type:'blob',sha:(await response.json()).sha});
          }
          for(const file of ['scripts/prepare-extension-publication.mjs','scripts/prepare-extension-ui-isolation.mjs'])tree.push({path:file,mode:'100644',type:'blob',sha:null});
          const tracked=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0');
          if(tracked.includes('.github/workflows/extension-sdk-recovery.yml'))tree.push({path:'.github/workflows/extension-sdk-recovery.yml',mode:'100644',type:'blob',sha:null});
          console.log('BASE_TREE bf3fc55cfb30cf24ab77f4d704aea560304bc7ed');
          console.log('NORMALIZED_FILES',JSON.stringify(tree));
          await writeFile(`${process.env.RUNNER_TEMP}/extension-publication.json`,JSON.stringify({baseTree:'bf3fc55cfb30cf24ab77f4d704aea560304bc7ed',tree},null,2));
          execFileSync('git',['diff','--check'],{stdio:'inherit'});
          console.log(execFileSync('git',['diff','--stat'],{encoding:'utf8'}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: normalized-extension-publication
          path: ${{ runner.temp }}/extension-publication.json
          retention-days: 7
          if-no-files-found: error
