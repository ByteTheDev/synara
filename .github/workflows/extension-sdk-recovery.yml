# Temporary integration bridge; application publication omits this workflow.
name: Extension stack integration
on:
  push:
    branches: [feat/synara-code-oss-extensions]
    paths: [.github/workflows/extension-sdk-recovery.yml]
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: eed74ef5491f768f4e437a85e0b67611795bfcdf
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Apply only the two concurrent PR1 commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {writeFile} from 'node:fs/promises';
          const response=await fetch('https://api.github.com/repos/Emanuele-web04/synara/compare/ac0eb01a0dc7aba5a08aeac217baeb63ff30b260...1afe7988935562d1a7946927f1a247af3523a033?per_page=1',{
            headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(30000),
          });
          if(!response.ok)throw new Error(`PR1 comparison: ${response.status}`);
          const result=await response.json();
          if(result.ahead_by!==2||result.behind_by!==0)throw new Error('Unexpected PR1 integration range');
          const allowed=new Set(['apps/web/e2e/editorIntelligence.e2e.ts','apps/web/src/components/codeEditor/CodeEditorPane.browser.tsx',
            'apps/web/src/components/codeEditor/MonacoEditorSurface.tsx','docs/editor/intelligence.md',
            'scripts/build-desktop-artifact-mac-config.test.ts','scripts/lib/desktop-platform-build-config.ts','scripts/lib/desktop-runtime-files.cjs']);
          if(result.files.length!==allowed.size)throw new Error('Unexpected PR1 change set');
          const patches=[];
          for(const file of result.files){
            if(!allowed.has(file.filename)||!file.patch||!['added','modified'].includes(file.status))throw new Error(`Unexpected PR1 path ${file.filename}`);
            patches.push(`diff --git a/${file.filename} b/${file.filename}\n${file.status==='added'?'new file mode 100644\n':''}--- ${file.status==='added'?'/dev/null':`a/${file.filename}`}\n+++ b/${file.filename}\n${file.patch}\n`);
          }
          const patch=patches.join('');
          execFileSync('git',['apply','--check','-'],{input:patch,stdio:['pipe','inherit','inherit']});
          execFileSync('git',['apply','-'],{input:patch,stdio:['pipe','inherit','inherit']});
          await writeFile(`${process.env.RUNNER_TEMP}/pr1-integration.json`,JSON.stringify([...allowed]));
          console.log('Applied PR1 packaging and rename-input fixes without modifying the PR1 branch.');
          NODE
      - name: Format the integrated files
        run: |
          ./node_modules/.bin/oxfmt apps/web/e2e/editorIntelligence.e2e.ts \
            apps/web/src/components/codeEditor/CodeEditorPane.browser.tsx apps/web/src/components/codeEditor/MonacoEditorSurface.tsx \
            docs/editor/intelligence.md scripts/build-desktop-artifact-mac-config.test.ts \
            scripts/lib/desktop-platform-build-config.ts scripts/lib/desktop-runtime-files.cjs
      - name: Export integrated blobs without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          const files=JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/pr1-integration.json`,'utf8'));
          const tree=[];
          for(const file of files){
            const response=await fetch('https://api.github.com/repos/Emanuele-web04/synara/git/blobs',{
              method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
              body:JSON.stringify({content:await readFile(file,'utf8'),encoding:'utf-8'}),signal:AbortSignal.timeout(30000),
            });
            if(!response.ok)throw new Error(`Blob ${file}: ${response.status}`);
            tree.push({path:file,mode:'100644',type:'blob',sha:(await response.json()).sha});
          }
          console.log('BASE_TREE cc1f487b61bfb97615f725be28f732172b65314b');
          console.log('INTEGRATED_FILES',JSON.stringify(tree));
          execFileSync('git',['diff','--check'],{stdio:'inherit'});
          console.log(execFileSync('git',['diff','--stat'],{encoding:'utf8'}));
          NODE
      - name: Required format and type checks
        run: |
          bun run fmt:check
          bun run typecheck > "$RUNNER_TEMP/types.log" 2>&1 || { grep -E 'error TS|error:' "$RUNNER_TEMP/types.log"; exit 1; }
