# Temporary execution bridge; no branch refs are moved by this workflow.
name: Extension candidate validation
on:
  push:
    branches: [feat/synara-code-oss-extensions]
    paths: [.github/workflows/extension-sdk-recovery.yml]
permissions:
  contents: read
concurrency:
  group: extension-candidate-${{ github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_BASE: 32948b773877e58e16cc105c70d5dfa3bfb1490b
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.objects.outputs.candidate }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_BASE }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: node scripts/connect-extension-debugger.mjs
      - run: |
          ./node_modules/.bin/oxfmt apps/server/src/extensions apps/server/src/platform/extensionHostSandbox.ts \
            apps/web/src/components/codeEditor/editorExtensionBridge.ts \
            apps/web/src/components/codeEditor/editorDebugStore.ts apps/web/src/components/codeEditor/extensionDebugBackend.ts
      - name: Preserve normalized candidate objects, not refs
        id: objects
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFile,appendFile} from 'node:fs/promises';
          async function api(endpoint,body) {
            const response=await fetch(`https://api.github.com/repos/Emanuele-web04/synara/${endpoint}`,{
              method:body?'POST':'GET',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
              ...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(30000),
            });
            if(!response.ok)throw new Error(`${endpoint}: ${response.status} ${await response.text()}`);
            return response.json();
          }
          const files=execFileSync('git',['diff','--name-only','-z','HEAD'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const allowed=new Set(['apps/server/src/platform/extensionHostSandbox.ts','apps/web/src/components/codeEditor/editorExtensionBridge.ts','apps/web/src/components/codeEditor/editorDebugStore.ts','apps/web/src/components/codeEditor/extensionDebugBackend.ts']);
          const tree=[];
          for(const file of files){
            if(!file.startsWith('apps/server/src/extensions/')&&!allowed.has(file))throw new Error(`Unexpected edit ${file}`);
            const blob=await api('git/blobs',{content:await readFile(file,'utf8'),encoding:'utf-8'});
            tree.push({path:file,mode:'100644',type:'blob',sha:blob.sha});
          }
          tree.push({path:'scripts/connect-extension-debugger.mjs',mode:'100644',type:'blob',sha:null});
          const base=await api(`git/commits/${process.env.CANDIDATE_BASE}`);
          const result=await api('git/trees',{base_tree:base.tree.sha,tree});
          const identity={name:'Commander Chara',email:'249489759+cmdr-chara@users.noreply.github.com'};
          const commit=await api('git/commits',{message:'feat(extensions): integrate contributed debuggers with native Synara state',tree:result.sha,parents:[process.env.PARENT_SHA,process.env.CANDIDATE_BASE],author:identity,committer:identity});
          console.log(`::notice title=Normalized extension candidate::commit=${commit.sha} tree=${result.sha}`);
          await appendFile(process.env.GITHUB_OUTPUT,`candidate=${commit.sha}\n`);
          NODE
  contracts:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Web and server contracts
        run: |
          bun run --cwd apps/web typecheck > "$RUNNER_TEMP/types.log" 2>&1 || { tail -60 "$RUNNER_TEMP/types.log"; exit 1; }
          bun run --cwd apps/server typecheck > "$RUNNER_TEMP/types.log" 2>&1 || { tail -60 "$RUNNER_TEMP/types.log"; exit 1; }
  runtime:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - uses: actions/download-artifact@v4
        with:
          name: code-oss-offline-build-sdk
          run-id: 38770793874
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/sdk
      - name: Verify immutable upstream inputs
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sdk"
          sha256sum -c SDK.sha256
          mkdir -p "$RUNNER_TEMP/code-oss"
          tar -I zstd -xf extension-sdk.tar.zst -C "$RUNNER_TEMP/code-oss"
          cd "$RUNNER_TEMP/code-oss"
          curl --fail --silent --show-error --location --max-time 90 'https://codeload.github.com/microsoft/vscode/tar.gz/7debcd0e2acdea1c52de81bf9ee1620444407dda' -o source.tar.gz
          echo '75b125b51f7258dbbd4cafb25ae658ea0edac4f2f5ad2ff9f61aeb8e1f99ee5e  source.tar.gz' | sha256sum -c -
          tar -xzf source.tar.gz
      - name: Build actual Code-OSS host
        env:
          SYNARA_CODE_OSS_SOURCE: ${{ runner.temp }}/code-oss/vscode-7debcd0e2acdea1c52de81bf9ee1620444407dda
          SYNARA_CODE_OSS_OUTPUT: ${{ runner.temp }}/code-oss-runtime
          SYNARA_ESBUILD_MODULE: ${{ runner.temp }}/code-oss/builder/node_modules/esbuild/lib/main.js
        run: node scripts/build-code-oss-host.mjs
      - name: Install sandbox and native debugger
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap gdb
      - name: Actual formatter, LSP and debugger VSIX tests
        env:
          SYNARA_TEST_CODE_OSS_HOST: ${{ runner.temp }}/code-oss-runtime/extension-host.mjs
          SYNARA_TEST_EXTENSION_SANDBOX: '1'
        run: bun run --cwd apps/server test src/extensions/realRuntime.test.ts src/extensions/realLanguageServer.test.ts src/extensions/realDebuggerExtension.test.ts
      - name: Install browser
        if: ${{ !cancelled() }}
        run: bun run --cwd apps/web test:browser:install
      - name: Native application installation and formatting
        if: ${{ !cancelled() }}
        env:
          SYNARA_TEST_CODE_OSS_HOST: ${{ runner.temp }}/code-oss-runtime/extension-host.mjs
        run: cd apps/web && ./node_modules/.bin/playwright test --config playwright.extensions.config.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: native-extension-application-evidence
          path: apps/web/test-results
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: code-oss-candidate-runtime
          path: ${{ runner.temp }}/code-oss-runtime
          if-no-files-found: warn
          retention-days: 7
