# Temporary branch-only recovery; removed from the final extension implementation tree.
name: Extension SDK recovery
on:
  push:
    branches: [feat/synara-code-oss-extensions]
    paths: [.github/workflows/extension-sdk-recovery.yml]
permissions:
  contents: read
jobs:
  sdk:
    if: github.repository == 'Emanuele-web04/synara'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recover exact headless Node host dependencies
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/node-host/probe"
          cd "$RUNNER_TEMP/node-host/probe"
          npm init -y >/dev/null
          npm install --ignore-scripts --package-lock=false --no-audit --no-fund \
            @vscode/proxy-agent@0.45.0 @vscode/ripgrep-universal@1.18.0 \
            vscode-regexpp@3.1.0 minimist@1.2.8 http-proxy-agent@7.0.2 \
            https-proxy-agent@7.0.6 undici@7.28.0
          cd "$RUNNER_TEMP/node-host"
          tar -czf node-host-dependencies.tar.gz probe
      - uses: actions/upload-artifact@v4
        with:
          name: extension-node-host-dependencies
          path: ${{ runner.temp }}/node-host/node-host-dependencies.tar.gz
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
