name: Original native preferences acceptance
on:
  push:
    branches: [codex/1920-editor-surface-qa]
    paths: [.github/workflows/code-oss-editor-original-preferences.yml]
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 82257a2f8e80bb2ef18fb77e4d4c72fba689b5f7
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: bounded-files-evidence
          run-id: 38582542551
          github-token: ${{ github.token }}
          path: .code-oss/import
      - name: Restore checked source and preserve original native constructor options
        run: |
          tar -xzf .code-oss/import/verified-source.tar.gz
          python - <<'PY'
          from pathlib import Path
          def replace(path,before,after):
              p=Path(path);s=p.read_text();assert s.count(before)==1,(path,before);p.write_text(s.replace(before,after))
          prefix='apps/desktop/code-oss/'
          replace(prefix+'patches.json','synaraHost()?.onWindow(this._win);','synaraHost()?.onWindow(this._win, options.webPreferences!);')
          host=prefix+'overlay/src/vs/synara/electron-main/host.ts'
          replace(host,'Session } from "electron"','Session, WebPreferences } from "electron"')
          replace(host,'onWindow(window: BrowserWindow): void;','onWindow(window: BrowserWindow, preferences: WebPreferences): void;')
          main='apps/desktop/src/codeOssHost.ts'
          replace(main,'  type Session,','  type Session,\n  type WebPreferences,')
          replace(main,'onWindow(window: BrowserWindow): void;','onWindow(window: BrowserWindow, preferences: WebPreferences): void;')
          replace(main,'onWindow: (window) => this.attachWindow(window),','onWindow: (window, preferences) => this.attachWindow(window, preferences),')
          replace(main,'private attachWindow(window: BrowserWindow): void {','private attachWindow(window: BrowserWindow, preferences: WebPreferences): void {')
          replace(main,'createNativeEditorView(window);','createNativeEditorView(window, preferences);')
          p=Path('apps/desktop/src/nativeEditorView.ts')
          p.write_text('''import { BrowserWindow, WebContentsView, type WebContents, type WebPreferences } from "electron";
          import electronPin from "../code-oss/electron.json";

          /** Adopt the existing native renderer with its ORIGINAL constructor preferences.
           * Electron replaces preferences when a WebContentsView adopts existing contents.
           * Never reconstruct them from getLastWebPreferences: it is not a round-trip API.
           * The only private API here releases ownership for the pinned Electron version.
           */
          export function createNativeEditorView(window: BrowserWindow, preferences: WebPreferences): WebContentsView {
            const contents = window.webContents as WebContents & { _setOwnerWindow?: (owner: BrowserWindow | null) => void };
            if (process.versions.electron !== electronPin.version || typeof contents._setOwnerWindow !== "function") {
              throw new Error("The bundled Electron runtime does not support the reviewed editor view seam.");
            }
            if (!preferences || typeof preferences.preload !== "string" || !preferences.preload || preferences.sandbox !== true || preferences.contextIsolation === false || preferences.nodeIntegration === true || preferences.webSecurity === false) {
              throw new Error("The original native workbench preload and sandbox must be configured before embedding it.");
            }
            let view: WebContentsView;
            contents._setOwnerWindow(null);
            try {
              view = new WebContentsView({ webContents: contents, webPreferences: preferences });
            } finally { contents._setOwnerWindow(window); }
            window.contentView.addChildView(view);
            if (window.webContents !== contents || BrowserWindow.fromWebContents(contents) !== window) {
              throw new Error("The native editor lost its owning Synara window.");
            }
            return view;
          }
          ''')
          p=Path('apps/desktop/src/nativeEditorView.test.ts');s=p.read_text()
          s=s.replace('createNativeEditorView(window as unknown as BrowserWindow)', 'createNativeEditorView(window as unknown as BrowserWindow, preferences)')
          s=s.replace('const { window, contents } = fixture();', 'const { window, contents, preferences } = fixture();')
          a=s.index('  it("rejects changed security preferences')
          s=s[:a]+'''  it("rejects missing preload or unsafe original preferences before adoption", () => {
              const { window, contents, preferences } = fixture();
              for (const invalid of [{ ...preferences, preload: "" }, { ...preferences, sandbox: false }, { ...preferences, nodeIntegration: true }, { ...preferences, contextIsolation: false }, { ...preferences, webSecurity: false }]) {
                expect(() => createNativeEditorView(window as unknown as BrowserWindow, invalid)).toThrow("preload and sandbox");
              }
              expect(contents._setOwnerWindow).not.toHaveBeenCalled();
              expect(window.contentView.addChildView).not.toHaveBeenCalled();
            });
          });
          '''
          p.write_text(s)
          PY
      - uses: ./.github/actions/setup-code-oss
        with:
          flavor: production
          arch: x64
      - name: Validate upstream native interfaces
        working-directory: .code-oss/source
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run typecheck-client
      - uses: ./.github/actions/setup-workspace
        with:
          scope: full
          electron: 'true'
      - name: Format changed source and check embedding boundary
        run: |
          node_modules/.bin/oxfmt apps/desktop/src/nativeEditorView.ts apps/desktop/src/nativeEditorView.test.ts apps/desktop/src/codeOssHost.ts apps/desktop/code-oss/overlay/src/vs/synara/electron-main/host.ts apps/desktop/code-oss/patches.json
          bun run --cwd apps/desktop typecheck
          bun run --cwd apps/desktop test -- src/nativeEditorView.test.ts src/editorSurface.test.ts
          bun run build:desktop
      - name: Preserve complete checked source and compiled resources
        run: |
          tar -czf .code-oss/compiled-editor.tar.gz apps/desktop/dist-electron apps/server/dist apps/web/dist
          tar -czf .code-oss/native-editor.tar.gz -C .code-oss runtime
          git ls-files -z | tar --null -T - -czf .code-oss/native-editor-source.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: original-preferences-resources
          path: |
            .code-oss/compiled-editor.tar.gz
            .code-oss/native-editor.tar.gz
            .code-oss/native-editor-source.tar.gz
          retention-days: 3
      - name: Display and sandbox
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb scrot ffmpeg libasound2t64 libgtk-3-0t64 libnss3 libgbm1 >/dev/null
          SANDBOX=$(realpath apps/desktop/node_modules/electron/dist/chrome-sandbox)
          sudo chown root:root "$SANDBOX" && sudo chmod 4755 "$SANDBOX"
      - name: Actual existing Files surface acceptance
        env:
          SYNARA_SMOKE_OUTPUT: .code-oss/evidence
          SYNARA_VERIFY_MODAL: '1'
        run: timeout --signal=TERM --kill-after=10s 240s xvfb-run -a -s '-screen 0 1440x1000x24' node apps/desktop/code-oss/scripts/smoke.mjs --appearance
      - name: Focused diagnostics
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('.code-oss/evidence').glob('*'):
              if p.suffix in ['.txt','.json']:print('\n'+p.name+'\n'+p.read_text(errors='replace')[-14000:])
              elif p.name=='after-electron.log':print('\n'+p.name+'\n'+p.read_text(errors='replace')[:12000])
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-preferences-evidence
          path: .code-oss/evidence
          retention-days: 7
          if-no-files-found: warn
