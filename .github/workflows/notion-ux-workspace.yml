name: Notion UX workspace

on:
  push:
    branches: [feat/notion-enterprise-oauth-integration]
    paths: [.github/workflows/notion-ux-workspace.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 7fb4a362e1224898f0d35493949690320a306696
          persist-credentials: false
      - name: Archive pinned tracked source only
        run: |
          mkdir -p "$RUNNER_TEMP/notion-ux-workspace"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/notion-ux-workspace/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/notion-ux-workspace/source-commit.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: notion-ux-pinned-workspace
          path: ${{ runner.temp }}/notion-ux-workspace
          retention-days: 2
          if-no-files-found: error
