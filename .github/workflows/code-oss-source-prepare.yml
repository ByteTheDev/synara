name: Prepare and validate single-app source
on:
  push:
    branches: [codex/1919-single-app-code-oss]
    paths: [.code-oss-work/**, .github/workflows/code-oss-source-prepare.yml]
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Materialize hash-checked edits without changing refs
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const sha = data => crypto.createHash('sha256').update(data).digest('hex');
          const edits = ['main-edits.json', 'other-edits.json'].flatMap(name => JSON.parse(fs.readFileSync('.code-oss-work/' + name, 'utf8')));
          const paths = new Set();
          for (const row of edits) {
            if (!/^(apps\/|packages\/|scripts\/|package\.json$|\.gitignore$|\.github\/workflows\/release-platform\.yml$)/.test(row.path) || row.path.includes('..') || paths.has(row.path)) throw Error('Unexpected source path');
            let text = fs.readFileSync(row.path);
            if (sha(text) !== row.base) throw Error('Changed base: ' + row.path);
            for (const [start, length, replacement] of [...row.edits].reverse()) {
              if (!Number.isInteger(start) || !Number.isInteger(length) || start < 0 || length < 0 || start + length > text.length) throw Error('Invalid edit');
              text = Buffer.concat([text.subarray(0, start), Buffer.from(replacement), text.subarray(start + length)]);
            }
            if (sha(text) !== row.result) throw Error('Changed output: ' + row.path);
            fs.writeFileSync(row.path, text); paths.add(row.path);
          }
          const fixes = [
            ['apps/desktop/src/main.ts', '  if (!allowed) {\n    writeDesktopLogHeader(`${reason} stayed because chats are still running`);', '  if (!allowed) {\n    codeOss.restoreAfterFailedShutdown();\n    writeDesktopLogHeader(`${reason} stayed because chats are still running`);'],
            ['apps/web/src/components/DesktopIdeCoordinator.tsx', '  return hasUnseenCompletion(thread) || Boolean(', '  return hasUnseenCompletion(thread) || (thread.session?.status === "error" && (!thread.lastVisitedAt || thread.session.updatedAt > thread.lastVisitedAt)) || Boolean('],
            ['apps/desktop/src/codeOssHost.ts', 'item.accelerator = this.accelerator ?? undefined', 'item.accelerator = this.accelerator'],
            ['apps/desktop/src/codeOssHost.ts', 'const [width, height] = this.window.getContentSize();', 'const { width, height } = this.window.getContentBounds();'],
            ['apps/desktop/code-oss/overlay/src/vs/synara/electron-browser/workbench.ts', 'private body: HTMLElement | undefined;', 'private agentBody: HTMLElement | undefined;'],
          ];
          for (const [path, before, after] of fixes) {
            const text = fs.readFileSync(path, 'utf8');
            if (text.split(before).length !== 2) throw Error('Non-unique follow-up anchor: ' + path);
            fs.writeFileSync(path, text.replace(before, after)); paths.add(path);
          }
          const pane = 'apps/desktop/code-oss/overlay/src/vs/synara/electron-browser/workbench.ts';
          fs.writeFileSync(pane, fs.readFileSync(pane, 'utf8').replaceAll('this.body', 'this.agentBody'));
          fs.copyFileSync('.code-oss-work/smoke.mjs', 'apps/desktop/code-oss/scripts/smoke.mjs');
          paths.add('apps/desktop/code-oss/scripts/smoke.mjs');
          for (const path of execFileSync('git', ['ls-files'], {encoding:'utf8'}).trim().split('\n')) {
            if (path.startsWith('apps/desktop/code-oss/') || path.startsWith('.github/actions/setup-code-oss/') || [
              'apps/desktop/src/codeOssHost.ts','apps/desktop/src/desktopRenderer.ts','apps/desktop/src/desktopRenderer.test.ts',
              'apps/web/src/components/DesktopIdeCoordinator.tsx','apps/web/src/desktopIdeStore.ts','apps/web/src/lib/desktopIdeContext.ts',
              'packages/contracts/src/desktopIde.ts','packages/contracts/src/desktopIde.test.ts',
              'scripts/lib/code-oss-runtime.ts','scripts/lib/code-oss-runtime.test.ts'
            ].includes(path)) paths.add(path);
          }
          fs.writeFileSync('prepared-paths.json', JSON.stringify([...paths]));
          JS
      - uses: ./.github/actions/setup-workspace
        with:
          scope: full
          electron: 'false'
      - name: Format only the implementation files
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const paths = JSON.parse(fs.readFileSync('prepared-paths.json', 'utf8'));
          execFileSync('node_modules/.bin/oxfmt', paths.filter(path => /\.(ts|tsx|mjs|json|css|yml)$/.test(path)), {stdio:'inherit'});
          const manifest = paths.map(path => ({path, sha256:crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex')}));
          fs.writeFileSync('prepared-manifest.json', JSON.stringify(manifest, null, 2));
          execFileSync('tar', ['-czf', 'prepared-source.tar.gz', 'prepared-manifest.json', ...paths]);
          JS
      - uses: actions/upload-artifact@v7
        with:
          name: prepared-synara-source
          path: prepared-source.tar.gz
          retention-days: 3
          if-no-files-found: error
  verify:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: prepared-synara-source
      - run: tar -xzf prepared-source.tar.gz
      - uses: ./.github/actions/setup-workspace
        with:
          scope: full
          electron: 'false'
      - name: Remove preparation-only files from validation workspace
        run: rm -rf .code-oss-work .github/workflows/code-oss-source-prepare.yml .github/workflows/code-oss-source-snapshot.yml prepared-source.tar.gz prepared-manifest.json
      - name: Check affected interfaces and focused behavior
        run: |
          bun run fmt:check
          bun run lint
          bun run --cwd apps/desktop typecheck
          bun run --cwd apps/web typecheck
          bun run --cwd apps/desktop test -- src/desktopRenderer.test.ts src/runningChatsQuitGuard.test.ts
          bun run --cwd packages/contracts test -- src/desktopIde.test.ts
          bun run --cwd scripts test -- lib/code-oss-runtime.test.ts
  native:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: prepared-synara-source
      - run: tar -xzf prepared-source.tar.gz
      - uses: ./.github/actions/setup-code-oss
        with:
          flavor: production
          arch: x64
      - name: Check native workbench interface contracts
        working-directory: .code-oss/source
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run typecheck-client
      - name: Archive verified native resources
        run: tar -czf code-oss-runtime.tar.gz -C .code-oss runtime
      - uses: actions/upload-artifact@v7
        with:
          name: code-oss-native-linux-x64
          path: code-oss-runtime.tar.gz
          retention-days: 3
          if-no-files-found: error
  baseline:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: a62d7c733d19f5538ffc0d126d57437b3b578ff1
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: prepared-synara-source
          path: .code-oss
      - run: mkdir -p .code-oss/prepared && tar -xzf .code-oss/prepared-source.tar.gz -C .code-oss/prepared
      - uses: ./.github/actions/setup-workspace
        with:
          scope: full
          electron: 'true'
      - name: Build unchanged main-branch application
        run: bun run build:desktop
      - name: Prepare real Linux desktop capture
        run: sudo apt-get update && sudo apt-get install -y xvfb scrot libasound2t64 libgtk-3-0t64 libnss3 libgbm1
      - name: Capture actual baseline
        env:
          SYNARA_SMOKE_OUTPUT: .code-oss/screenshots
        run: xvfb-run -a -s '-screen 0 1440x1000x24' node .code-oss/prepared/apps/desktop/code-oss/scripts/smoke.mjs --baseline
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synara-before-native-integration
          path: .code-oss/screenshots
          retention-days: 7
          if-no-files-found: warn
  smoke:
    needs: [source, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: prepared-synara-source
      - run: tar -xzf prepared-source.tar.gz
      - uses: actions/download-artifact@v8
        with:
          name: code-oss-native-linux-x64
          path: .code-oss
      - run: tar -xzf .code-oss/code-oss-runtime.tar.gz -C .code-oss
      - uses: ./.github/actions/setup-workspace
        with:
          scope: full
          electron: 'true'
      - name: Build integrated application
        run: bun run build:desktop
      - name: Prepare real Linux desktop capture
        run: sudo apt-get update && sudo apt-get install -y xvfb scrot libasound2t64 libgtk-3-0t64 libnss3 libgbm1
      - name: Exercise real single-app workbench and retained Agent view
        env:
          SYNARA_SMOKE_OUTPUT: .code-oss/screenshots
        run: xvfb-run -a -s '-screen 0 1440x1000x24' node apps/desktop/code-oss/scripts/smoke.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synara-after-native-integration
          path: .code-oss/screenshots
          retention-days: 7
          if-no-files-found: warn
  blobs:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: prepared-synara-source
      - name: Read-only validation of prepared artifact data
        run: |
          python - <<'PY'
          import tarfile, pathlib
          with tarfile.open('prepared-source.tar.gz') as archive:
              for item in archive.getmembers():
                  path = pathlib.PurePosixPath(item.name)
                  if not item.isfile() or path.is_absolute() or '..' in path.parts or item.size > 1000000:
                      raise ValueError('Invalid prepared source member')
              archive.extractall('source', filter='data')
          PY
      - name: Store content-addressed source blobs only; connector publishes tree and ref
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const manifest = JSON.parse(fs.readFileSync('source/prepared-manifest.json', 'utf8'));
            const entries = [];
            if (!Array.isArray(manifest) || manifest.length > 80) throw Error('Invalid manifest');
            for (const item of manifest) {
              if (!/^(apps\/|packages\/|scripts\/|package\.json$|\.gitignore$|\.github\/actions\/setup-code-oss\/|\.github\/workflows\/release-platform\.yml$)/.test(item.path) || item.path.includes('..')) throw Error('Unexpected path');
              const bytes = fs.readFileSync('source/' + item.path);
              if (crypto.createHash('sha256').update(bytes).digest('hex') !== item.sha256) throw Error('Content hash mismatch');
              const {data} = await github.rest.git.createBlob({...context.repo, content:bytes.toString('base64'), encoding:'base64'});
              entries.push({path:item.path, mode:'100644', type:'blob', sha:data.sha, sha256:item.sha256});
            }
            fs.writeFileSync('prepared-blobs.json', JSON.stringify(entries, null, 2));
      - uses: actions/upload-artifact@v7
        with:
          name: prepared-synara-blobs
          path: prepared-blobs.json
          retention-days: 3
          if-no-files-found: error
