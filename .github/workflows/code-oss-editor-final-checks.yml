name: Existing editor final source checks
on:
  push:
    branches: [codex/1920-editor-surface-qa]
    paths: [.github/workflows/code-oss-editor-final-checks.yml]
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 82257a2f8e80bb2ef18fb77e4d4c72fba689b5f7
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: bounded-files-evidence
          run-id: 38586616119
          github-token: ${{ github.token }}
          path: .code-oss/import
      - name: Restore exact integrated source and current visible navigation
        run: |
          tar -xzf .code-oss/import/checked-source.tar.gz
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/desktop/code-oss/scripts/smoke.mjs');s=p.read_text()
          anchor='      await agent.getByRole("button", { name: "Editor view", exact: true }).click();'
          assert s.count(anchor)==1
          s=s.replace(anchor,'''      const environment = agent.getByRole("button", { name: "Toggle environment panel", exact: true });
                if ((await environment.getAttribute("aria-pressed")) !== "true") await environment.click();
          '''+anchor)
          # Keep one explicit default rather than the temporary duplicate watchdog setting.
          s=s.replace('  application.context().setDefaultTimeout(15000);\n','')
          p.write_text(s)
          PY
      - uses: ./.github/actions/setup-workspace
        with:
          scope: full
          electron: 'true'
      - name: Format only the revised harness
        run: node_modules/.bin/oxfmt apps/desktop/code-oss/scripts/smoke.mjs
      - name: Preserve reviewable source and diff
        run: |
          mkdir -p .code-oss/final
          git diff --check
          git diff --stat
          git diff > .code-oss/final/source.patch
          python - <<'PY'
          import subprocess,hashlib,json,tarfile
          from pathlib import Path
          paths=subprocess.check_output(['git','diff','--name-only','-z']).decode().strip('\0').split('\0')
          allowed={'apps/desktop/code-oss/overlay/src/vs/synara/electron-main/host.ts','apps/desktop/code-oss/patches.json','apps/desktop/code-oss/scripts/smoke.mjs','apps/desktop/src/codeOssHost.ts','apps/desktop/src/editorSurface.ts','apps/desktop/src/editorSurface.test.ts','apps/desktop/src/nativeEditorView.ts','apps/desktop/src/nativeEditorView.test.ts','apps/web/src/components/EditorWorkspaceView.tsx'}
          assert set(paths)==allowed,(paths,allowed)
          manifest=[{'path':p,'sha256':hashlib.sha256(Path(p).read_bytes()).hexdigest()} for p in paths]
          Path('.code-oss/final/manifest.json').write_text(json.dumps(manifest,indent=2))
          with tarfile.open('.code-oss/final/source.tar.gz','w:gz') as archive:
              for p in paths:archive.add(p)
          PY
      - name: Required integrated static checks and affected React tests
        run: |
          set +e
          bun run fmt:check > .code-oss/final/format.log 2>&1; fmt=$?
          bun run lint > .code-oss/final/lint.log 2>&1; lint=$?
          bun run typecheck > .code-oss/final/typecheck.log 2>&1; types=$?
          bun run test:web:focused src/components/EditorWorkspaceView.test.tsx > .code-oss/final/web-tests.log 2>&1; tests=$?
          printf 'format=%s lint=%s typecheck=%s affected_web_tests=%s\n' "$fmt" "$lint" "$types" "$tests" | tee .code-oss/final/results.txt
          test "$fmt$lint$types$tests" = 0000
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: final-editor-source-checks
          path: .code-oss/final
          retention-days: 7
  review:
    needs: source
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: final-editor-source-checks
      - name: Report exact changes and check results
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['results.txt','source.patch','format.log','lint.log','typecheck.log','web-tests.log']:
              p=Path(name)
              if p.exists():print('\nFILE '+name+'\n'+p.read_text(errors='replace')[-48000:])
          PY
  blobs:
    needs: source
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: final-editor-source-checks
      - name: Extract source as data
        run: |
          python - <<'PY'
          import tarfile,pathlib
          with tarfile.open('source.tar.gz') as archive:
              for item in archive.getmembers():
                  p=pathlib.PurePosixPath(item.name)
                  if not item.isfile() or p.is_absolute() or '..' in p.parts or item.size>300000:raise ValueError('Unexpected source member')
              archive.extractall('source',filter='data')
          PY
      - uses: actions/github-script@v8
        with:
          script: |
            const fs=require('node:fs'),crypto=require('node:crypto');
            const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8'));
            const allowed=new Set(['apps/desktop/code-oss/overlay/src/vs/synara/electron-main/host.ts','apps/desktop/code-oss/patches.json','apps/desktop/code-oss/scripts/smoke.mjs','apps/desktop/src/codeOssHost.ts','apps/desktop/src/editorSurface.ts','apps/desktop/src/editorSurface.test.ts','apps/desktop/src/nativeEditorView.ts','apps/desktop/src/nativeEditorView.test.ts','apps/web/src/components/EditorWorkspaceView.tsx']);
            if(manifest.length!==allowed.size)throw Error('Unexpected source count');
            const result=[];
            for(const item of manifest){
              if(!allowed.delete(item.path))throw Error('Unexpected path');
              const bytes=fs.readFileSync('source/'+item.path);
              if(crypto.createHash('sha256').update(bytes).digest('hex')!==item.sha256)throw Error('Invalid source hash');
              const {data}=await github.rest.git.createBlob({...context.repo,content:bytes.toString('base64'),encoding:'base64'});
              result.push({...item,sha:data.sha,mode:'100644',type:'blob'});
            }
            console.log('SOURCE_BLOBS='+JSON.stringify(result));
            // No commits or branch changes: final publication stays with the connector.
