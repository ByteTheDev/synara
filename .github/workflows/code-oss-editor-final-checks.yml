name: Existing editor documentation finalization
on:
  push:
    branches: [codex/1920-editor-surface-qa]
    paths: [.github/workflows/code-oss-editor-final-checks.yml]
permissions:
  contents: read
  actions: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c524c0bbda673f634b420f060a8575080d6d7f5b
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          scope: full
          electron: 'true'
      - name: Format only the architecture document and finish pending narrow lint
        run: |
          node_modules/.bin/oxfmt docs/code-oss.md
          node_modules/.bin/oxfmt --check docs/code-oss.md apps/desktop/src/codeOssHost.ts apps/desktop/code-oss/scripts/appearance-smoke.mjs
          node_modules/.bin/oxlint --report-unused-disable-directives apps/desktop/src/codeOssHost.ts apps/desktop/code-oss/scripts/appearance-smoke.mjs
          git diff --check
          test "$(git diff --name-only)" = docs/code-oss.md
          git diff -- docs/code-oss.md
      - uses: actions/upload-artifact@v7
        with:
          name: formatted-editor-documentation
          path: docs/code-oss.md
          retention-days: 7
  export:
    needs: format
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: formatted-editor-documentation
      - uses: actions/github-script@v8
        with:
          script: |
            const fs=require('node:fs'),crypto=require('node:crypto');
            const bytes=fs.readFileSync('code-oss.md');
            if(bytes.length>30000 || !bytes.toString('utf8').startsWith('# Native Code-OSS in Synara'))throw Error('Unexpected documentation artifact');
            const {data}=await github.rest.git.createBlob({...context.repo,content:bytes.toString('base64'),encoding:'base64'});
            console.log('FORMATTED_DOC_BLOB='+JSON.stringify({path:'docs/code-oss.md',sha:data.sha,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),bytes:bytes.length}));
            // Export only the reviewed document blob; no commit or branch changes.
