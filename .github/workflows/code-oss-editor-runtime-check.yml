name: Bounded existing Files acceptance
on:
  push:
    branches: [codex/1920-editor-surface-qa]
    paths: [.github/workflows/code-oss-editor-runtime-check.yml]
permissions:
  contents: read
  actions: read
jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 82257a2f8e80bb2ef18fb77e4d4c72fba689b5f7
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: original-preferences-resources
          run-id: 38583801636
          github-token: ${{ github.token }}
          path: .code-oss/import
      - uses: actions/download-artifact@v8
        with:
          name: final-editor-source-checks
          run-id: 38587622382
          github-token: ${{ github.token }}
          path: .code-oss/checked
      - name: Restore verified source and preserve same-document editor placement
        run: |
          tar -xzf .code-oss/checked/source.tar.gz
          tar -xzf .code-oss/import/compiled-editor.tar.gz
          tar -xzf .code-oss/import/native-editor.tar.gz -C .code-oss
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/desktop/src/codeOssHost.ts');s=p.read_text()
          before='''    this.agent.webContents.on("did-start-navigation", (_event, _url, _inPlace, isMainFrame) => {
                if (!isMainFrame) return;'''
          after='''    this.agent.webContents.on("did-start-navigation", (_event, _url, isInPlace, isMainFrame) => {
                // Hash routing retains the same React-owned slot. Clear it only when
                // the main document is replaced, not when selecting a file or session.
                if (!isMainFrame || isInPlace) return;'''
          assert s.count(before)==1
          p.write_text(s.replace(before,after))
          PY
      - uses: ./.github/actions/setup-workspace
        with:
          scope: full
          electron: 'true'
      - name: Check changed host and rebuild only the desktop entry
        run: |
          node_modules/.bin/oxfmt apps/desktop/src/codeOssHost.ts
          bun run --cwd apps/desktop typecheck
          bun run --cwd packages/contracts build
          bun run --cwd apps/desktop build
          mkdir -p .code-oss/evidence
          git diff --check
          git diff --stat
          git diff > .code-oss/evidence/source-changes.patch
          tar -czf .code-oss/evidence/desktop-entry.tar.gz apps/desktop/dist-electron
          python - <<'PY'
          import tarfile,subprocess,hashlib,json
          from pathlib import Path
          paths=subprocess.check_output(['git','diff','--name-only','-z']).decode().strip('\0').split('\0')
          with tarfile.open('.code-oss/evidence/source.tar.gz','w:gz') as archive:
              for p in paths:archive.add(p)
          Path('.code-oss/evidence/manifest.json').write_text(json.dumps([{'path':p,'sha256':hashlib.sha256(Path(p).read_bytes()).hexdigest()} for p in paths],indent=2))
          PY
      - name: Display and sandbox
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb scrot ffmpeg libasound2t64 libgtk-3-0t64 libnss3 libgbm1 >/dev/null
          SANDBOX=$(realpath apps/desktop/node_modules/electron/dist/chrome-sandbox)
          sudo chown root:root "$SANDBOX" && sudo chmod 4755 "$SANDBOX"
      - name: Exercise native Files UI with a finite watchdog
        env:
          SYNARA_SMOKE_OUTPUT: .code-oss/evidence
          SYNARA_VERIFY_MODAL: '1'
        run: timeout --signal=TERM --kill-after=10s 240s xvfb-run -a -s '-screen 0 1440x1000x24' node apps/desktop/code-oss/scripts/smoke.mjs --appearance
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bounded-files-evidence
          path: .code-oss/evidence
          retention-days: 7
  diagnostics:
    needs: desktop
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bounded-files-evidence
      - name: Read focused evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          for p in Path('.').glob('*'):
              if p.name=='probe-at-failure.json':
                  d=json.loads(p.read_text());d.pop('extensionIds',None);print(p.name,json.dumps(d));continue
              if p.suffix in ['.txt','.json']:print('\n'+p.name+'\n'+p.read_text(errors='replace')[-20000:])
          PY
