name: Bounded existing Files acceptance
on:
  push:
    branches: [codex/1920-editor-surface-qa]
    paths: [.github/workflows/code-oss-editor-runtime-check.yml]
permissions:
  contents: read
  actions: read
jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 82257a2f8e80bb2ef18fb77e4d4c72fba689b5f7
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: original-preferences-resources
          run-id: 38583801636
          github-token: ${{ github.token }}
          path: .code-oss/import
      - name: Restore exact checked source and compiled application
        run: |
          tar -xzf .code-oss/import/native-editor-source.tar.gz
          tar -xzf .code-oss/import/compiled-editor.tar.gz
          tar -xzf .code-oss/import/native-editor.tar.gz -C .code-oss
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/desktop/code-oss/scripts/smoke.mjs');s=p.read_text()
          anchor='      await agent.locator("[data-editor-workspace]").waitFor({ state: "visible" });'
          assert s.count(anchor)==1
          s=s.replace(anchor,anchor+'''
                // The original editor defaults to Diff. Select its existing Files
                // activity item, but do not re-click an already active Files sidebar.
                const files = agent.getByRole("navigation", { name: "Editor activity bar", exact: true }).getByRole("button", { name: "Files", exact: true });
                if (await files.count()) await files.click();''')
          p.write_text(s)
          PY
      - uses: ./.github/actions/setup-workspace
        with:
          scope: full
          electron: 'true'
      - name: Check revised navigation harness and retain source changes
        run: |
          node_modules/.bin/oxfmt apps/desktop/code-oss/scripts/smoke.mjs
          node --check apps/desktop/code-oss/scripts/smoke.mjs
          mkdir -p .code-oss/evidence
          git diff --check
          git diff --stat
          git diff > .code-oss/evidence/source-changes.patch
          git ls-files -z | tar --null -T - -czf .code-oss/evidence/checked-source.tar.gz
      - name: Display and sandbox
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb scrot ffmpeg libasound2t64 libgtk-3-0t64 libnss3 libgbm1 >/dev/null
          SANDBOX=$(realpath apps/desktop/node_modules/electron/dist/chrome-sandbox)
          sudo chown root:root "$SANDBOX" && sudo chmod 4755 "$SANDBOX"
      - name: Exercise native Files UI with a finite watchdog
        env:
          SYNARA_SMOKE_OUTPUT: .code-oss/evidence
          SYNARA_VERIFY_MODAL: '1'
        run: timeout --signal=TERM --kill-after=10s 240s xvfb-run -a -s '-screen 0 1440x1000x24' node apps/desktop/code-oss/scripts/smoke.mjs --appearance
      - name: Focused failure diagnostics
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('.code-oss/evidence').glob('*'):
              if p.suffix in ['.txt','.json']:print('\n'+p.name+'\n'+p.read_text(errors='replace')[-18000:])
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bounded-files-evidence
          path: .code-oss/evidence
          retention-days: 7
