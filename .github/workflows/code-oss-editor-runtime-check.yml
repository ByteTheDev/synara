name: Bounded existing Files acceptance
on:
  push:
    branches: [codex/1920-editor-surface-qa]
    paths: [.github/workflows/code-oss-editor-runtime-check.yml]
permissions:
  contents: read
  actions: read
jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 82257a2f8e80bb2ef18fb77e4d4c72fba689b5f7
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          scope: full
          electron: 'true'
      - uses: actions/download-artifact@v8
        with:
          name: native-preload-repaired-app
          run-id: 38581381708
          github-token: ${{ github.token }}
          path: .code-oss/import
      - uses: actions/download-artifact@v8
        with:
          name: existing-editor-runtime
          run-id: 38571986911
          github-token: ${{ github.token }}
          path: .code-oss/import
      - name: Restore exact compiled application and bound locator waits
        run: |
          tar -xzf .code-oss/import/repaired-editor.tar.gz
          tar -xzf .code-oss/import/repaired-source.tar.gz
          tar -xzf .code-oss/import/existing-editor-runtime.tar.gz -C .code-oss
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/desktop/code-oss/scripts/smoke.mjs');s=p.read_text()
          anchor='  application.process().stdout?.on("data", (bytes) => {'
          assert s.count(anchor)==1
          s=s.replace(anchor,'  application.context().setDefaultTimeout(15000);\n  application.context().setDefaultNavigationTimeout(30000);\n'+anchor)
          p.write_text(s)
          PY
          node_modules/.bin/oxfmt apps/desktop/code-oss/scripts/smoke.mjs
      - name: Display and sandbox
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb scrot ffmpeg libasound2t64 libgtk-3-0t64 libnss3 libgbm1 >/dev/null
          SANDBOX=$(realpath apps/desktop/node_modules/electron/dist/chrome-sandbox)
          sudo chown root:root "$SANDBOX" && sudo chmod 4755 "$SANDBOX"
      - name: Exercise native Files UI with a finite watchdog
        env:
          SYNARA_SMOKE_OUTPUT: .code-oss/evidence
          SYNARA_VERIFY_MODAL: '1'
        run: timeout --signal=TERM --kill-after=10s 240s xvfb-run -a -s '-screen 0 1440x1000x24' node apps/desktop/code-oss/scripts/smoke.mjs --appearance
      - name: Preserve source and focused failure diagnostics
        if: always()
        run: |
          mkdir -p .code-oss/evidence
          tar -czf .code-oss/evidence/verified-source.tar.gz apps/desktop/src/nativeEditorView.ts apps/desktop/src/nativeEditorView.test.ts apps/desktop/src/codeOssHost.ts apps/desktop/src/editorSurface.ts apps/desktop/src/editorSurface.test.ts apps/web/src/components/EditorWorkspaceView.tsx apps/desktop/code-oss/scripts/smoke.mjs
          python - <<'PY'
          from pathlib import Path
          for p in Path('.code-oss/evidence').glob('*'):
              if p.suffix in ['.txt','.json']:print('\n'+p.name+'\n'+p.read_text(errors='replace')[-16000:])
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bounded-files-evidence
          path: .code-oss/evidence
          retention-days: 7
