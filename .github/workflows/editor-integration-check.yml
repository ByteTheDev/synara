# Branch-only execution support for the editor integration work.
# This does not publish releases, modify repository refs, or use application data.
name: Editor integration check

on:
  push:
    branches:
      - feat/synara-editor-intelligence
      - feat/synara-code-oss-extensions
    paths:
      - .github/workflows/editor-integration-check.yml

permissions:
  contents: read

concurrency:
  group: editor-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkout:
    name: Prepare isolated source checkout
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the exact feature commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Archive tracked source without Git credentials or user state
        run: |
          git rev-parse HEAD
          git archive --format=tar.gz --output="$RUNNER_TEMP/synara-editor-source.tar.gz" HEAD

      - name: Export source for the isolated implementation environment
        uses: actions/upload-artifact@v4
        with:
          name: synara-editor-source-${{ github.sha }}
          path: ${{ runner.temp }}/synara-editor-source.tar.gz
          retention-days: 1
          if-no-files-found: error
