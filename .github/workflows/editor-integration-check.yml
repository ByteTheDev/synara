# Temporary branch-only provisioning. No releases or repository-ref writes.
name: Editor integration check

on:
  push:
    branches:
      - feat/synara-editor-intelligence
    paths:
      - .github/workflows/editor-integration-check.yml

permissions:
  contents: read

concurrency:
  group: editor-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-runtime:
    name: Verify upstream standalone debug adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download the pinned MIT-licensed upstream release
        env:
          DEBUG_VERSION: 1.140.0
          DEBUG_SHA256: 27dab92937ec1ab35821ae955aac867544fe06a1b6307229049f2d789af10968
        run: |
          mkdir -p "$RUNNER_TEMP/debug-runtime"
          cd "$RUNNER_TEMP/debug-runtime"
          curl --fail --location --retry 2 --max-time 90 --output js-debug.tar.gz "https://github.com/microsoft/vscode-js-debug/releases/download/v${DEBUG_VERSION}/js-debug-dap-v${DEBUG_VERSION}.tar.gz"
          echo "$DEBUG_SHA256  js-debug.tar.gz" | sha256sum --check
          printf '%s\n' "$DEBUG_VERSION" > version.txt
          printf '%s\n' "$DEBUG_SHA256" > sha256.txt
          tar -tzf js-debug.tar.gz | head -30 || test "${PIPESTATUS[0]}" = 141
      - uses: actions/upload-artifact@v4
        with:
          name: synara-js-debug-runtime
          path: ${{ runner.temp }}/debug-runtime
          retention-days: 1
          if-no-files-found: error
