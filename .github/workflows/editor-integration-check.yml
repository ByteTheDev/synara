# Temporary branch-only provisioning. No releases or repository-ref writes.
name: Editor integration check

on:
  push:
    branches:
      - feat/synara-editor-intelligence
    paths:
      - .github/workflows/editor-integration-check.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: editor-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Split the verified dependency export into bounded transfers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the existing exact-baseline dependency artifact
        uses: actions/download-artifact@v4
        with:
          name: synara-editor-dependencies-c0a1b6b9385d2833972b8e5df90841837871064d
          run-id: 38643355070
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/editor-dependencies

      - name: Split into 200 MiB parts
        run: |
          cd "$RUNNER_TEMP/editor-dependencies"
          sha256sum synara-editor-dependencies.tar.gz
          split -b 200M -d -a 2 synara-editor-dependencies.tar.gz dependencies.part-
          ls -lh dependencies.part-*

      - name: Export part 00
        uses: actions/upload-artifact@v4
        with:
          name: synara-editor-dependencies-part-00
          path: ${{ runner.temp }}/editor-dependencies/dependencies.part-00
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Export part 01
        uses: actions/upload-artifact@v4
        with:
          name: synara-editor-dependencies-part-01
          path: ${{ runner.temp }}/editor-dependencies/dependencies.part-01
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Export part 02
        uses: actions/upload-artifact@v4
        with:
          name: synara-editor-dependencies-part-02
          path: ${{ runner.temp }}/editor-dependencies/dependencies.part-02
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Export part 03
        uses: actions/upload-artifact@v4
        with:
          name: synara-editor-dependencies-part-03
          path: ${{ runner.temp }}/editor-dependencies/dependencies.part-03
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
