# Temporary branch-only source transfer and real-browser verification.
# Application publication is performed through the interactive GitHub connector.
name: Editor candidate verification
on:
  push:
    branches: [feat/synara-editor-intelligence]
    paths: ['.integration-transfer/**', '.github/workflows/editor-integration-check.yml']
permissions:
  contents: read
concurrency:
  group: editor-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    if: github.repository == 'Emanuele-web04/synara' && github.ref == 'refs/heads/feat/synara-editor-intelligence'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: a21eb2b43dc16dcc33c55271070d3bdb4a3c1cfb
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: candidate/package.json
      - name: Verify source and store unreferenced blobs
        env:
          SOURCE_BLOB_TOKEN: ${{ github.token }}
        run: node .integration-transfer/materialize.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: editor-candidate-source
          path: |
            ${{ runner.temp }}/editor-candidate-*.json
            ${{ runner.temp }}/editor-blobs-ready.json
            ${{ runner.temp }}/editor-candidate-source.tar.gz
          retention-days: 3
          if-no-files-found: error
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: candidate/package.json
      - name: Install exact candidate dependencies
        working-directory: candidate
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: bun install --frozen-lockfile
      - name: Full server typecheck
        working-directory: candidate
        run: bun run --cwd apps/server typecheck
      - name: Real compiler and debugger
        if: ${{ !cancelled() }}
        working-directory: candidate
        env:
          SYNARA_TEST_JS_DEBUG: '1'
        run: bun run --cwd apps/server test src/editor/typescriptService.test.ts src/editor/dapConnection.test.ts src/editor/debugService.test.ts
      - name: Install test browser
        if: ${{ !cancelled() }}
        working-directory: candidate
        run: bun run --cwd apps/web test:browser:install
      - name: Real editor regression tests
        if: ${{ !cancelled() }}
        working-directory: candidate
        run: bun run --cwd apps/web test:browser src/components/codeEditor/CodeEditorPane.browser.tsx src/components/codeEditor/editorModels.browser.tsx
      - name: Real application journey and screenshots
        if: ${{ !cancelled() }}
        working-directory: candidate
        run: bun run --cwd apps/web test:editor:e2e
      - name: Build browser and compiler-worker bundles
        if: ${{ !cancelled() }}
        working-directory: candidate
        run: |
          bun run --cwd apps/server build
          bun run --cwd apps/web build
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: editor-candidate-browser-evidence
          path: |
            candidate/apps/web/test-results
            candidate/apps/web/src/components/**/__screenshots__
          retention-days: 7
          if-no-files-found: warn
