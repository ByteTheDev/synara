# Temporary branch-only dependency provisioning. No releases or ref writes.
name: Editor integration check

on:
  push:
    branches:
      - feat/synara-editor-intelligence
    paths:
      - .github/workflows/editor-integration-check.yml

permissions:
  contents: read

concurrency:
  group: editor-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-runtime:
    name: Resolve and export the pinned editor runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Resolve Monaco without changing unrelated dependencies
        run: |
          bun add --cwd apps/web --exact monaco-editor@0.55.1 --lockfile-only --ignore-scripts
          mkdir -p "$RUNNER_TEMP/editor-runtime"
          npm pack monaco-editor@0.55.1 --pack-destination "$RUNNER_TEMP/editor-runtime"
          cp bun.lock "$RUNNER_TEMP/editor-runtime/bun.lock"
          cp apps/web/package.json "$RUNNER_TEMP/editor-runtime/web-package.json"
          npm view monaco-editor@0.55.1 dist --json > "$RUNNER_TEMP/editor-runtime/monaco-dist.json"
      - uses: actions/upload-artifact@v4
        with:
          name: synara-monaco-runtime
          path: ${{ runner.temp }}/editor-runtime
          retention-days: 1
          if-no-files-found: error
