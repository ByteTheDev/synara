name: Notion integration source snapshot

on:
  push:
    branches: [feat/notion-enterprise-oauth-integration]
    paths: [.github/workflows/notion-workspace-bootstrap.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked application source only
        run: git archive --format=tar.gz --output=/tmp/notion-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: notion-source-only
          path: /tmp/notion-source.tar.gz
          retention-days: 1
          compression-level: 0
