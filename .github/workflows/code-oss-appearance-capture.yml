name: Final Synara UI runtime acceptance
on:
  push:
    branches: [codex/1920-synara-appearance-qa]
    paths: [.github/workflows/code-oss-appearance-capture.yml]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 2d9c5477901c18a9adce93cf39122c444ade150a
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          scope: full
          electron: 'true'
      - uses: actions/download-artifact@v8
        with:
          name: synara-appearance-runtime
          run-id: 38554432762
          github-token: ${{ github.token }}
          path: .code-oss/qa-runtime
      - uses: actions/download-artifact@v8
        with:
          name: synara-appearance-final-controls
          run-id: 38555271552
          github-token: ${{ github.token }}
          path: .code-oss/controls
      - name: Use the checked native build and the final checked Synara UI
        run: |
          tar -xzf .code-oss/qa-runtime/appearance-runtime.tar.gz
          tar -xzf .code-oss/controls/compiled-synara.tar.gz
      - name: Add focused verification of the docked new-session control
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/desktop/code-oss/scripts/appearance-smoke.mjs')
          s=p.read_text()
          s+='''

          export async function verifySessionControl({ agent, until, record }) {
            const before = await agent.evaluate(() => window.desktopBridge.ide.getState());
            const identity = await agent.evaluate(() => window.__synaraSmokeIdentity);
            await agent.getByRole("button", { name: "New Synara session", exact: true }).click();
            const next = await until(
              () => agent.evaluate(() => window.desktopBridge.ide.getState()),
              (state) => state.scope.threadId && state.scope.threadId !== before.scope.threadId,
              "docked new-session control selects a fresh Synara session",
              20000,
            );
            if (next.mode !== "ide" || next.status !== "ready")
              throw new Error("Creating a session left the ready native IDE");
            if ((await agent.evaluate(() => window.__synaraSmokeIdentity)) !== identity)
              throw new Error("Creating a session reloaded the retained Agent renderer");
            await record("docked new-session control creates a fresh session without reloading Agent or leaving IDE", {
              previous: before.scope.threadId,
              selected: next.scope.threadId,
              mode: next.mode,
            });
          }
          '''
          p.write_text(s)
          p=Path('apps/desktop/code-oss/scripts/smoke.mjs')
          s=p.read_text()
          anchor='    await writeFile(join(output, "native-dom.txt"), await workbench.locator("body").innerText());'
          assert s.count(anchor)==1
          s=s.replace(anchor,anchor+'\n    if (process.argv.includes("--appearance")) {\n      const { verifySessionControl } = await import("./appearance-smoke.mjs");\n      await verifySessionControl({ agent, until, record });\n    }')
          p.write_text(s)
          PY
          node_modules/.bin/oxfmt apps/desktop/code-oss/scripts/appearance-smoke.mjs apps/desktop/code-oss/scripts/smoke.mjs
          node --check apps/desktop/code-oss/scripts/appearance-smoke.mjs
          node --check apps/desktop/code-oss/scripts/smoke.mjs
          node_modules/.bin/oxlint apps/desktop/code-oss/scripts/appearance-smoke.mjs apps/desktop/code-oss/scripts/smoke.mjs
          git diff --check
          mkdir -p .code-oss/screenshots
          cp docs/images/code-oss/after-ide-git.png .code-oss/screenshots/before-synara-ide.png
          tar -czf .code-oss/screenshots/acceptance-source.tar.gz apps/desktop/code-oss/scripts/appearance-smoke.mjs apps/desktop/code-oss/scripts/smoke.mjs
      - name: Prepare real Linux display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb scrot ffmpeg libasound2t64 libgtk-3-0t64 libnss3 libgbm1 > .code-oss/display.log 2>&1
      - name: Run the actual final Electron app
        timeout-minutes: 5
        env:
          SYNARA_SMOKE_OUTPUT: .code-oss/screenshots
          SYNARA_VERIFY_MODAL: '1'
        run: xvfb-run -a -s '-screen 0 1440x1000x24' node apps/desktop/code-oss/scripts/smoke.mjs --appearance
      - name: Preserve actual GIF and review images
        run: |
          ffmpeg -y -loglevel error -i .code-oss/screenshots/agent-ide-switch.mp4 -vf 'fps=6,scale=960:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse' .code-oss/screenshots/agent-ide-synara-ui.gif
          for mode in dark light; do ffmpeg -y -loglevel error -i .code-oss/screenshots/after-synara-ide-$mode.png -vf scale=960:-1 -c:v libwebp -quality 65 .code-oss/screenshots/review-$mode.webp; done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synara-ui-final-evidence
          path: .code-oss/screenshots
          retention-days: 7
  evidence:
    needs: capture
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: synara-ui-final-evidence
      - name: Report actual checks and failures
        run: |
          for file in after-checks.json failure.txt failure-page-1.txt failure-page-2.txt; do if [ -f "$file" ]; then echo "=== $file ==="; head -c 15000 "$file"; echo; fi; done
          grep -E 'appearance|Uncaught|Failed to load|Error:' after-electron.log | tail -15 || true
      - name: Validate final acceptance source as data
        if: needs.capture.result == 'success'
        run: |
          python - <<'PY'
          import tarfile,pathlib
          with tarfile.open('acceptance-source.tar.gz') as archive:
              for item in archive.getmembers():
                  p=pathlib.PurePosixPath(item.name)
                  if not item.isfile() or p.is_absolute() or '..' in p.parts or item.size>100000: raise ValueError('Unexpected source')
              archive.extractall('source',filter='data')
          PY
      - name: Store passing captures and test sources without publishing a branch
        if: needs.capture.result == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('node:fs'),crypto=require('node:crypto');
            const checks=JSON.parse(fs.readFileSync('after-checks.json','utf8'));
            if(fs.existsSync('failure.txt')||!checks.some(c=>c.name==='native IDE follows Synara dark colors and typography'&&c.passed)||!checks.some(c=>c.name==='native IDE follows Synara light colors and typography'&&c.passed)||!checks.some(c=>c.name.startsWith('docked new-session control creates')&&c.passed))throw Error('Incomplete UI acceptance');
            const files=['after-synara-ide-dark.png','after-synara-ide-light.png','before-synara-ide.png','agent-ide-synara-ui.gif'].map(name=>[name,'docs/images/code-oss/'+name]);
            files.push(['after-agent-mode.png','docs/images/code-oss/after-synara-agent.png']);
            for(const path of ['apps/desktop/code-oss/scripts/appearance-smoke.mjs','apps/desktop/code-oss/scripts/smoke.mjs'])files.push(['source/'+path,path]);
            for(const [source,path] of files){
              const bytes=fs.readFileSync(source);
              if(bytes.length>3000000)throw Error('Unexpected source or image size');
              if(path.endsWith('.png')&&!bytes.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10])))throw Error('Invalid PNG');
              if(path.endsWith('.gif')&&!['GIF87a','GIF89a'].includes(bytes.subarray(0,6).toString()))throw Error('Invalid GIF');
              const {data}=await github.rest.git.createBlob({...context.repo,content:bytes.toString('base64'),encoding:'base64'});
              console.log('FINAL_UI_BLOB='+JSON.stringify({path,sha:data.sha,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),mode:'100644',type:'blob'}));
            }
            for(const mode of ['dark','light']){
              const bytes=fs.readFileSync('review-'+mode+'.webp');
              console.log('REVIEW_SHA_'+mode+'='+crypto.createHash('sha256').update(bytes).digest('hex'));
              console.log('REVIEW_'+mode+'='+bytes.toString('base64'));
            }
