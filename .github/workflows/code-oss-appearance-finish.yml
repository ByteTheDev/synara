name: Final Synara appearance and composer acceptance
on:
  push:
    branches: [codex/1920-synara-appearance-qa]
    paths: [.github/workflows/code-oss-appearance-finish.yml]
permissions:
  contents: read
  actions: read
jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 9703e5e80bcbe6f302d83e467dfa066154d4e8c8
          persist-credentials: false
      - name: Fit the retained chat to its native pane and strengthen visual acceptance
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/web/src/index.css')
          s=p.read_text()
          anchor=':root[data-synara-mode="ide"] .synara-route-content :where(.h-svh, .h-screen) {'
          assert s.count(anchor)==1
          s=s.replace(anchor, '/* Docked chat uses the remaining pane height below its session header,\n   not a full viewport that would push the composer outside the native view. */\n:root[data-synara-mode="ide"] .synara-route-content :is(.h-dvh, .h-svh, .h-screen) {')
          p.write_text(s)
          p=Path('apps/desktop/code-oss/scripts/appearance-smoke.mjs')
          s=p.read_text()
          def replace(before,after):
              global s
              assert s.count(before)==1, before
              s=s.replace(before,after)
          replace('const hex = (name) => {', 'const hex = (name, target = style) => {')
          replace('context.fillStyle = style.getPropertyValue(name);', 'context.fillStyle = target.getPropertyValue(name);')
          replace('        accent: hex("--vscode-focusBorder"),', '        accent: hex("--vscode-focusBorder"),\n        statusbar: hex("background-color", getComputedStyle(root.querySelector(".part.statusbar"))),\n        statusbarForeground: hex("color", getComputedStyle(root.querySelector(".part.statusbar"))),')
          replace('native.sidebar === appearance.colors.surface,', 'native.sidebar === appearance.colors.surface &&\n        native.statusbar === appearance.colors.shell &&\n        native.statusbarForeground === appearance.colors.foreground,')
          anchor='  for (const mode of ["dark", "light"]) {'
          helper='''  async function composerBounds() {
              return agent.evaluate(() => {
                const surface = document.querySelector(".chat-composer-surface");
                const editor = document.querySelector('[contenteditable="true"]');
                if (!surface || !editor) return null;
                const box = surface.getBoundingClientRect();
                return {
                  top: box.top, bottom: box.bottom, left: box.left, right: box.right,
                  width: innerWidth, height: innerHeight,
                  visible: box.width > 0 && box.height > 0 && box.top >= 0 &&
                    box.left >= 0 && box.bottom <= innerHeight + 1 && box.right <= innerWidth + 1,
                };
              });
            }
          '''
          replace(anchor,helper+anchor)
          replace('    // Let Electron composite both sibling views before the actual desktop capture.', '    const bounds = await until(composerBounds, (value) => value?.visible, "entire docked composer and toolbar stay inside their pane");\n    // Wait for resolved status-bar colors above, including native theme transitions,\n    // before compositing both sibling views for the actual desktop capture.')
          replace('await record(`native IDE follows Synara ${mode} colors and typography`, actual);', 'await record(`native IDE follows Synara ${mode} colors and typography`, { ...actual, composer: bounds });')
          replace('  await setTheme("dark");\n}', '''  await setTheme("dark");
            const originalBounds = await application.evaluate(({ BrowserWindow }) => BrowserWindow.getAllWindows()[0].getBounds());
            await application.evaluate(({ BrowserWindow }) => BrowserWindow.getAllWindows()[0].setBounds({ width: 1100, height: 720 }));
            const compact = await until(composerBounds, (value) => value?.visible && value.height < 720, "composer remains visible in a smaller native window");
            await record("docked composer and toolbar remain fully visible after native window resize", compact);
            await application.evaluate(({ BrowserWindow }, bounds) => BrowserWindow.getAllWindows()[0].setBounds(bounds), originalBounds);
            await until(composerBounds, (value) => value?.visible && value.height > 720, "composer restores after window resize");
          }''')
          p.write_text(s)
          PY
      - uses: ./.github/actions/setup-workspace
        with:
          scope: full
          electron: 'true'
      - name: Validate the final CSS and focused acceptance driver
        run: |
          node_modules/.bin/oxfmt apps/web/src/index.css apps/desktop/code-oss/scripts/appearance-smoke.mjs
          node_modules/.bin/oxfmt --check apps/web/src/index.css apps/desktop/code-oss/scripts/appearance-smoke.mjs
          node --check apps/desktop/code-oss/scripts/appearance-smoke.mjs
          node_modules/.bin/oxlint apps/desktop/code-oss/scripts/appearance-smoke.mjs
          bun run --cwd apps/web test -- src/uiFontSize.test.ts src/hasSelectorVariants.test.ts
          git diff --check
          git diff -- apps/web/src/index.css apps/desktop/code-oss/scripts/appearance-smoke.mjs
      - uses: actions/download-artifact@v8
        with:
          name: synara-appearance-runtime
          run-id: 38554432762
          github-token: ${{ github.token }}
          path: .code-oss/qa-runtime
      - run: tar -xzf .code-oss/qa-runtime/appearance-runtime.tar.gz
      - name: Build final Synara UI with the existing verified native workbench
        run: bun run build:desktop > .code-oss/build.log 2>&1 || { tail -80 .code-oss/build.log; exit 1; }
      - name: Preserve exact final source
        run: |
          mkdir -p .code-oss/screenshots
          tar -czf .code-oss/screenshots/appearance-final-source.tar.gz apps/web/src/index.css apps/desktop/code-oss/scripts/appearance-smoke.mjs
          cp docs/images/code-oss/before-synara-ide.png .code-oss/screenshots/before-synara-ide.png
      - name: Prepare display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb scrot ffmpeg libasound2t64 libgtk-3-0t64 libnss3 libgbm1 >/dev/null
      - name: Verify final native services, appearance, composer and session creation
        timeout-minutes: 4
        env:
          SYNARA_SMOKE_OUTPUT: .code-oss/screenshots
          SYNARA_VERIFY_MODAL: '1'
        run: xvfb-run -a -s '-screen 0 1440x1000x24' node apps/desktop/code-oss/scripts/smoke.mjs --appearance
      - name: Encode actual mode switching
        run: ffmpeg -y -loglevel error -i .code-oss/screenshots/agent-ide-switch.mp4 -vf 'fps=6,scale=960:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse' .code-oss/screenshots/agent-ide-synara-ui.gif
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synara-appearance-reviewed-evidence
          path: .code-oss/screenshots
          retention-days: 7
  publish_blobs:
    needs: finish
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: synara-appearance-reviewed-evidence
      - name: Validate final source data
        run: |
          python - <<'PY'
          import tarfile,pathlib
          with tarfile.open('appearance-final-source.tar.gz') as archive:
              for item in archive.getmembers():
                  p=pathlib.PurePosixPath(item.name)
                  if not item.isfile() or p.is_absolute() or '..' in p.parts or item.size>200000: raise ValueError('Unexpected source')
              archive.extractall('source',filter='data')
          PY
      - name: Store checked source and real captures without moving any branch
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('node:fs'),crypto=require('node:crypto');
            const checks=JSON.parse(fs.readFileSync('after-checks.json','utf8'));
            if(fs.existsSync('failure.txt')||checks.length!==19||!checks.every(c=>c.passed))throw Error('Final acceptance incomplete');
            const files=['after-synara-ide-dark.png','after-synara-ide-light.png','agent-ide-synara-ui.gif'].map(name=>[name,'docs/images/code-oss/'+name]);
            files.push(['after-agent-mode.png','docs/images/code-oss/after-synara-agent.png']);
            for(const path of ['apps/web/src/index.css','apps/desktop/code-oss/scripts/appearance-smoke.mjs'])files.push(['source/'+path,path]);
            for(const [source,path] of files){
              const bytes=fs.readFileSync(source);
              if(bytes.length>3000000)throw Error('Unexpected file size');
              if(path.endsWith('.png')&&!bytes.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10])))throw Error('Invalid PNG');
              if(path.endsWith('.gif')&&!['GIF87a','GIF89a'].includes(bytes.subarray(0,6).toString()))throw Error('Invalid GIF');
              const {data}=await github.rest.git.createBlob({...context.repo,content:bytes.toString('base64'),encoding:'base64'});
              console.log('REVIEWED_UI_BLOB='+JSON.stringify({path,sha:data.sha,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),mode:'100644',type:'blob'}));
            }
            console.log('REVIEWED_CHECKS='+JSON.stringify(checks));
