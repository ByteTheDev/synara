name: PR1858 format proof
on:
  push:
    branches:
      - codex/verify-1858-oxfmt-20261012
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
        with:
          scope: static
      - name: Format shared retry metrics
        run: |
          bunx oxfmt packages/shared/src/effortRetryMetrics.ts
          git diff -- packages/shared/src/effortRetryMetrics.ts
      - name: Retain exact formatted source
        uses: actions/upload-artifact@v4
        with:
          name: pr1858-oxfmt-exact
          path: packages/shared/src/effortRetryMetrics.ts
