name: Pin OpenCode binaries for startup phase measurement

on:
  push:
    branches: [codex/runtime-startup-native-metadata-20261011]

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Read registry metadata and verify downloaded bytes without executing them
        env:
          SYNARA_METADATA_OUTPUT: ${{ runner.temp }}/runtime-startup-native-metadata
        run: node .github/scripts/runtime-startup-native-metadata.mjs
      - name: Retain exact metadata, integrity observations and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-startup-native-metadata-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-startup-native-metadata
          if-no-files-found: error
          retention-days: 14
