name: Notion verified source handoff

on:
  pull_request:
    paths:
      - .github/workflows/notion-integrated-validation.yml
      - .github/scripts/notion-candidate-fixes.py
      - .github/scripts/notion-verified-recovery.json.gz

permissions:
  contents: read

concurrency:
  group: notion-integrated-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  candidate:
    if: github.event.pull_request.number == 1937 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/notion-enterprise-oauth-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          scope: full
      - name: Recover hash-pinned source
        id: prepare
        run: python3 .github/scripts/notion-candidate-fixes.py prepare
      - name: Formatting and lint
        id: style
        run: bun run fmt:check && bun run lint
      - name: Full workspace typecheck
        id: types
        if: success() || failure() && steps.prepare.outcome == 'success'
        run: bun run typecheck
      - name: Focused integration tests
        id: tests
        if: success() || failure() && steps.prepare.outcome == 'success'
        run: |
          bun run --cwd apps/server test src/notion src/agentGateway/notionTools.test.ts src/agentGateway/notionApproval.test.ts src/agentGateway/todoTools.test.ts
          bun run --cwd apps/web test src/components/notion
          bun run --cwd packages/shared test src/notion.test.ts
      - name: Install Chromium
        if: success() || failure() && steps.prepare.outcome == 'success'
        run: ./apps/web/node_modules/.bin/playwright install --with-deps chromium
      - name: Real native component browser evidence
        id: browser
        if: success() || failure() && steps.prepare.outcome == 'success'
        env:
          NOTION_BEFORE_REF: ac2d3c1d34fb48f53fe710b2f3556783fa4193f9
          NOTION_EVIDENCE_DIR: ${{ runner.temp }}/notion-verified/screenshots
        run: node "$RUNNER_TEMP/notion-verified/capture.mjs"
      - name: Export exact content-addressed blobs without moving any ref
        if: always() && steps.prepare.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RESULTS: ${{ toJSON(steps) }}
        run: python3 .github/scripts/notion-candidate-fixes.py export
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: notion-verified-source-and-screenshots
          path: ${{ runner.temp }}/notion-verified
          if-no-files-found: error
          retention-days: 14
