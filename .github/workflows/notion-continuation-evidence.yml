name: Notion continuation evidence

on:
  push:
    branches: [feat/notion-enterprise-oauth-integration]
    paths: [.github/workflows/notion-continuation-evidence.yml]
  pull_request:
    paths: [.github/workflows/notion-continuation-evidence.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Export source snapshots without modifying repository refs
        run: |
          mkdir -p "$RUNNER_TEMP/notion-source"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/notion-source/current.tar.gz"
          git archive --format=tar.gz d98d89e0c535da1e81be5856529db3425234171b > "$RUNNER_TEMP/notion-source/before.tar.gz"
          git archive --format=tar.gz 34a6aefbe846a90b0928a87d4f9d5de2083c55f3 > "$RUNNER_TEMP/notion-source/main.tar.gz"
          git ls-tree -r HEAD > "$RUNNER_TEMP/notion-source/current-tree.txt"
          git ls-tree -r 34a6aefbe846a90b0928a87d4f9d5de2083c55f3 > "$RUNNER_TEMP/notion-source/main-tree.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/notion-source/head.txt"
          sha256sum "$RUNNER_TEMP/notion-source/"*.tar.gz > "$RUNNER_TEMP/notion-source/digests.txt"
      - uses: actions/upload-artifact@v6
        with:
          name: notion-pinned-source
          path: ${{ runner.temp }}/notion-source
          retention-days: 1
          compression-level: 0
