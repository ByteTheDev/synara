name: Notion continuation evidence

on:
  pull_request:
    paths: [.github/workflows/notion-continuation-evidence.yml]

permissions:
  contents: read
  actions: read

jobs:
  toolchain:
    if: github.event.pull_request.number == 1937 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v6
        with:
          github-token: ${{ github.token }}
          run-id: 38721201627
          name: notion-continuation-toolchain
          path: ${{ runner.temp }}/notion-toolchain
      - name: Split existing pinned dependencies without installing or executing them
        run: |
          mkdir -p "$RUNNER_TEMP/notion-parts"
          split -b 240M "$RUNNER_TEMP/notion-toolchain/dependencies.tar.gz" "$RUNNER_TEMP/notion-parts/dependencies-"
          sha256sum "$RUNNER_TEMP/notion-toolchain/dependencies.tar.gz" > "$RUNNER_TEMP/notion-toolchain/dependencies.sha256"
          sha256sum "$RUNNER_TEMP/notion-parts/"* > "$RUNNER_TEMP/notion-toolchain/parts.sha256"
          ls -lh "$RUNNER_TEMP/notion-parts"
      - uses: actions/upload-artifact@v6
        with:
          name: notion-tools-binaries
          path: |
            ${{ runner.temp }}/notion-toolchain/bin
            ${{ runner.temp }}/notion-toolchain/bun.lock
            ${{ runner.temp }}/notion-toolchain/*.sha256
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v6
        with:
          name: notion-tools-part-aa
          path: ${{ runner.temp }}/notion-parts/dependencies-aa
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v6
        with:
          name: notion-tools-part-ab
          path: ${{ runner.temp }}/notion-parts/dependencies-ab
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v6
        with:
          name: notion-tools-part-ac
          path: ${{ runner.temp }}/notion-parts/dependencies-ac
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v6
        with:
          name: notion-tools-part-ad
          path: ${{ runner.temp }}/notion-parts/dependencies-ad
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
