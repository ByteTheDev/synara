name: Sidebar navigation rows verification
on:
  push:
    branches: [codex/sidebar-navigation-rows-check]
    paths: ['.workbench/**', '.github/workflows/sidebar-navigation-rows.yml']
permissions:
  contents: write
  actions: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 8
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38472088329
          name: sidebar-navigation-rows
          path: /tmp/sidebar-navigation-rows
      - name: Restore validated source and correct baseline selection
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, runpy
          module = runpy.run_path('.workbench/sidebar-rows.py')
          root = module['ROOT']
          manifest = json.loads((root / 'manifest.json').read_text())
          assert {entry['path'] for entry in manifest} == set(module['PATHS'])
          for entry in manifest:
              data = (root / 'candidate' / entry['path']).read_bytes()
              assert hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest() == entry['sha']
              pathlib.Path(entry['path']).write_bytes(data)
          script = pathlib.Path('.workbench/sidebar-rows.py')
          text = script.read_text()
          start = text.index("    for theme in ('light', 'dark'):", text.index('def capture():'))
          end = text.index('    original_test = TEST.read_text()', start)
          baseline = '''    for theme, section in (('light', 'projects'), ('dark', 'chats')):
                  source = Path(f'docs/pr-screenshots/sidebar-chat-access/apple-redesign/after-{theme}-{section}.png')
                  assert source.is_file(), source
                  shutil.copyfile(source, ROOT / f'before-{theme}-{section}.png')
          '''
          script.write_text(text[:start] + baseline + text[end:])
          print('Restored seven byte-identical validated source files; only capture setup changed.')
          PY
      - uses: ./.github/actions/setup-workspace
        with:
          scope: full
      - name: Install capture tools
        run: |
          (cd apps/web && bunx playwright install --with-deps chromium)
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Capture only - retain passing static and browser checks
        run: python3 .workbench/sidebar-rows.py capture
      - name: Export unchanged candidate and actual screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 .workbench/sidebar-rows.py export
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidebar-navigation-rows
          path: /tmp/sidebar-navigation-rows
          retention-days: 7
      - name: Require successful evidence and retained checks
        run: python3 .workbench/sidebar-rows.py gate
