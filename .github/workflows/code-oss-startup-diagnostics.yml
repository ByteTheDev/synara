name: Native startup source diagnostics
on:
  push:
    branches: [codex/1919-single-app-code-oss]
    paths: [.github/workflows/code-oss-startup-diagnostics.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: native-service-runtime
          run-id: 38530755801
          github-token: ${{ github.token }}
      - name: Inspect packaged built-ins and entry points
        run: |
          python - <<'PY'
          import tarfile,json
          with tarfile.open('code-oss-runtime.tar.gz') as archive:
              names=set(archive.getnames())
              packages=sorted(p for p in names if p.startswith('runtime/extensions/') and p.count('/')==3 and p.endswith('/package.json'))
              print('BUILTIN_COUNT',len(packages))
              print('BUILTIN_PACKAGES',json.dumps(packages))
              for name in ['typescript-language-features','git','git-base','ms-vscode.js-debug']:
                  p='runtime/extensions/'+name+'/package.json'
                  if p not in names:
                      print('MISSING',p);continue
                  data=json.load(archive.extractfile(p))
                  print('BUILTIN',json.dumps({k:data.get(k) for k in ['name','publisher','version','main','browser','engines','capabilities']}))
                  main=data.get('main')
                  if main:
                      import posixpath
                      base=posixpath.normpath(posixpath.join(posixpath.dirname(p),main))
                      print('ENTRY_EXISTS',base,base in names or base+'.js' in names)
          PY
