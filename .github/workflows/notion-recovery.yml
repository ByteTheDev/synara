name: Notion recovery verification
on:
  push:
    branches: [feat/notion-enterprise-oauth-integration]
    paths:
      - 'apps/server/src/notion/**'
      - 'apps/web/src/components/notion/**'
      - 'apps/web/src/components/settings/NotionSettingsPanel.tsx'
      - 'packages/shared/src/notion*'
      - 'packages/contracts/src/notion*'
      - '.github/notion-recovery/**'
      - '.github/workflows/notion-recovery.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 32
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Prepare native integration edits and format changed source
        run: python .github/notion-recovery/prepare.py
      - name: Typecheck integrated server and UI
        id: types
        continue-on-error: true
        run: |
          set +e
          failed=0
          for package in packages/contracts packages/shared apps/server apps/web; do
            bun run --cwd "$package" typecheck > "/tmp/$(basename "$package")-types.log" 2>&1
            status=$?
            echo "$package typecheck exit=$status"
            grep -E 'error TS|error:|^Error:' "/tmp/$(basename "$package")-types.log" || true
            if test "$status" -ne 0; then failed=1; fi
          done
          exit "$failed"
      - name: Run focused integration and regression tests
        id: tests
        continue-on-error: true
        run: |
          bun run --cwd packages/shared test src/notion.test.ts
          bun run --cwd apps/server test src/notion src/todo src/agentGateway/todoTools.test.ts
      - name: Lint changed product paths
        id: lint
        continue-on-error: true
        run: bun x oxlint apps/server/src/notion apps/server/src/todo/Layers/TodoService.ts apps/server/src/agentGateway/todoTools.ts apps/web/src/components/notion apps/web/src/components/settings/NotionSettingsPanel.tsx packages/shared/src/notion.ts packages/shared/src/notion.test.ts packages/contracts/src/notion.ts packages/contracts/src/notionRpc.ts
      - name: Export prepared Git tree without changing any branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/notion-recovery/export-tree.py
      - name: Report actual outcomes
        if: always()
        run: |
          echo 'types=${{ steps.types.outcome }} tests=${{ steps.tests.outcome }} lint=${{ steps.lint.outcome }}'
          test '${{ steps.types.outcome }}' = success
          test '${{ steps.tests.outcome }}' = success
          test '${{ steps.lint.outcome }}' = success
