name: Final Synara UI glyph acceptance
on:
  push:
    branches: [codex/1920-synara-appearance-qa]
    paths: [.github/workflows/code-oss-ui-final-glyphs.yml]
permissions:
  contents: read
  actions: read
jobs:
  final_ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 9703e5e80bcbe6f302d83e467dfa066154d4e8c8
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: synara-appearance-reviewed-evidence
          run-id: 38558941346
          github-token: ${{ github.token }}
          path: .code-oss/reviewed
      - name: Retain checked layout repair and make compact controls self-contained
        run: |
          tar -xzf .code-oss/reviewed/appearance-final-source.tar.gz
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/web/src/components/DesktopIdeCoordinator.tsx')
          s=p.read_text()
          for before,after in [('ChatBubbleIcon','MessageCircleIcon'),('CodeIcon','MonitorIcon'),('AddPlusIcon','PlusIcon')]:
              assert s.count(before)==2, before
              s=s.replace(before,after)
          p.write_text(s)
          p=Path('apps/desktop/code-oss/scripts/appearance-smoke.mjs')
          s=p.read_text()
          anchor='    screen(`after-synara-ide-${mode}.png`);'
          assert s.count(anchor)==1
          s=s.replace(anchor,'''    const icons = await agent.locator(".synara-ide-session-bar svg").evaluateAll((items) =>
                items.filter((item) => {
                  const bounds = item.getBoundingClientRect();
                  return bounds.width > 0 && bounds.height > 0 && item.querySelector("path, rect, circle, line, polyline");
                }).length,
              );
              if (icons < 3) throw new Error("Native mode/session controls are missing their inline glyphs");
          '''+anchor)
          p.write_text(s)
          PY
      - uses: ./.github/actions/setup-workspace
        with:
          scope: full
          electron: 'true'
      - name: Check final control source and existing session contract
        run: |
          node_modules/.bin/oxfmt apps/web/src/components/DesktopIdeCoordinator.tsx apps/desktop/code-oss/scripts/appearance-smoke.mjs
          node_modules/.bin/oxlint apps/web/src/components/DesktopIdeCoordinator.tsx apps/desktop/code-oss/scripts/appearance-smoke.mjs
          bun run --cwd apps/web typecheck
          node --check apps/desktop/code-oss/scripts/appearance-smoke.mjs
          git diff --check
      - uses: actions/download-artifact@v8
        with:
          name: synara-appearance-runtime
          run-id: 38554432762
          github-token: ${{ github.token }}
          path: .code-oss/qa-runtime
      - run: tar -xzf .code-oss/qa-runtime/appearance-runtime.tar.gz
      - name: Build final retained UI
        run: bun run build:desktop > .code-oss/build.log 2>&1 || { tail -80 .code-oss/build.log; exit 1; }
      - name: Preserve exact final source and display
        run: |
          mkdir -p .code-oss/screenshots
          tar -czf .code-oss/screenshots/ui-final-source.tar.gz apps/web/src/index.css apps/web/src/components/DesktopIdeCoordinator.tsx apps/desktop/code-oss/scripts/appearance-smoke.mjs
          cp docs/images/code-oss/before-synara-ide.png .code-oss/screenshots/before-synara-ide.png
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb scrot ffmpeg libasound2t64 libgtk-3-0t64 libnss3 libgbm1 >/dev/null
      - name: Final live application acceptance and screenshots
        timeout-minutes: 4
        env:
          SYNARA_SMOKE_OUTPUT: .code-oss/screenshots
          SYNARA_VERIFY_MODAL: '1'
        run: xvfb-run -a -s '-screen 0 1440x1000x24' node apps/desktop/code-oss/scripts/smoke.mjs --appearance
      - name: Encode actual recording
        run: ffmpeg -y -loglevel error -i .code-oss/screenshots/agent-ide-switch.mp4 -vf 'fps=6,scale=960:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse' .code-oss/screenshots/agent-ide-synara-ui.gif
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synara-ui-publish-evidence
          path: .code-oss/screenshots
          retention-days: 7
  blobs:
    needs: final_ui
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: synara-ui-publish-evidence
      - name: Validate source as data
        run: |
          python - <<'PY'
          import pathlib,tarfile
          with tarfile.open('ui-final-source.tar.gz') as archive:
              for item in archive.getmembers():
                  p=pathlib.PurePosixPath(item.name)
                  if not item.isfile() or p.is_absolute() or '..' in p.parts or item.size>200000: raise ValueError('Unexpected source')
              archive.extractall('source',filter='data')
          PY
      - name: Store final captures and reviewed sources without changing any branch
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('node:fs'),crypto=require('node:crypto');
            const checks=JSON.parse(fs.readFileSync('after-checks.json','utf8'));
            if(fs.existsSync('failure.txt')||checks.length!==19||!checks.every(c=>c.passed))throw Error('Incomplete final acceptance');
            const files=['after-synara-ide-dark.png','after-synara-ide-light.png','agent-ide-synara-ui.gif'].map(name=>[name,'docs/images/code-oss/'+name]);
            files.push(['after-agent-mode.png','docs/images/code-oss/after-synara-agent.png']);
            for(const path of ['apps/web/src/index.css','apps/web/src/components/DesktopIdeCoordinator.tsx','apps/desktop/code-oss/scripts/appearance-smoke.mjs'])files.push(['source/'+path,path]);
            for(const [source,path] of files){
              const bytes=fs.readFileSync(source);
              if(bytes.length>3000000)throw Error('Unexpected file size');
              if(path.endsWith('.png')&&!bytes.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10])))throw Error('Invalid PNG');
              if(path.endsWith('.gif')&&!['GIF87a','GIF89a'].includes(bytes.subarray(0,6).toString()))throw Error('Invalid GIF');
              const {data}=await github.rest.git.createBlob({...context.repo,content:bytes.toString('base64'),encoding:'base64'});
              console.log('PUBLISH_UI_BLOB='+JSON.stringify({path,sha:data.sha,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),mode:'100644',type:'blob'}));
            }
            console.log('FINAL_CHECKS='+JSON.stringify(checks));
