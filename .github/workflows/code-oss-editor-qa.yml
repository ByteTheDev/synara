name: Code OSS editor integration QA
on:
  push:
    branches: [qa/code-oss-editor-20261014]
permissions:
  contents: read
  actions: read
concurrency:
  group: code-oss-editor-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  split-dependencies:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: synara-offline-dependencies
          run-id: 38615403888
          github-token: ${{ github.token }}
          path: /tmp/synara-deps
      - name: Split archive within transfer limits
        run: |
          set -euo pipefail
          split -b 300M -d /tmp/synara-deps/synara-node-modules.tar.gz /tmp/synara-deps/modules.part-
      - uses: actions/upload-artifact@v4
        with:
          name: synara-offline-tools
          path: |
            /tmp/synara-deps/tools.tar.gz
            /tmp/synara-deps/sha256.txt
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: synara-modules-00
          path: /tmp/synara-deps/modules.part-00
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: synara-modules-01
          path: /tmp/synara-deps/modules.part-01
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: synara-modules-02
          path: /tmp/synara-deps/modules.part-02
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: synara-modules-03
          path: /tmp/synara-deps/modules.part-03
          compression-level: 0
          retention-days: 3
  native-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 85c70ad544f0409dc9051dde38c549530b2605ec
          persist-credentials: false
      - name: Record native compiler
        run: clang++ --version
      - uses: ./.github/actions/setup-code-oss
        with:
          flavor: production
          arch: x64
      - name: Archive reusable build dependencies and baseline runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/code-oss-deps
          tar -C .code-oss -czf /tmp/code-oss-deps/runtime.tar.gz runtime
          tar -C .code-oss -czf /tmp/code-oss-deps/prepared-source.tar.gz --exclude='source/.git' source
          sha256sum /tmp/code-oss-deps/*.tar.gz > /tmp/code-oss-deps/sha256.txt
          split -b 300M -d /tmp/code-oss-deps/runtime.tar.gz /tmp/code-oss-deps/runtime.part-
          split -b 300M -d /tmp/code-oss-deps/prepared-source.tar.gz /tmp/code-oss-deps/source.part-
      - uses: actions/upload-artifact@v4
        with:
          name: code-oss-runtime-00
          path: /tmp/code-oss-deps/runtime.part-00
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: code-oss-runtime-01
          path: /tmp/code-oss-deps/runtime.part-01
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: code-oss-runtime-02
          path: /tmp/code-oss-deps/runtime.part-02
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: code-oss-source-00
          path: /tmp/code-oss-deps/source.part-00
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: code-oss-source-01
          path: /tmp/code-oss-deps/source.part-01
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: code-oss-source-02
          path: /tmp/code-oss-deps/source.part-02
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: code-oss-source-03
          path: /tmp/code-oss-deps/source.part-03
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: code-oss-source-04
          path: /tmp/code-oss-deps/source.part-04
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: code-oss-source-05
          path: /tmp/code-oss-deps/source.part-05
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: code-oss-source-06
          path: /tmp/code-oss-deps/source.part-06
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: code-oss-source-07
          path: /tmp/code-oss-deps/source.part-07
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: code-oss-dependency-checksums
          path: /tmp/code-oss-deps/sha256.txt
          retention-days: 3
