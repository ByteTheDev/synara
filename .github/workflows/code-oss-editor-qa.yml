name: Code OSS source editing
on:
  push:
    branches: [qa/code-oss-editor-20261014]
    paths:
      - .github/workflows/code-oss-editor-qa.yml
      - .qa/code-oss-source-edit.py
permissions:
  contents: write
concurrency:
  group: code-oss-source-edit
  cancel-in-progress: false
jobs:
  edit-source:
    if: github.repository == 'Emanuele-web04/synara'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          path: operations
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: feat/code-oss-existing-editor
          path: source
          persist-credentials: true
      - name: Apply source-only integration edits
        shell: bash
        run: |
          set -euo pipefail
          cd source
          git fetch --no-tags --depth=1 origin a62d7c733d19f5538ffc0d126d57437b3b578ff1
          python - <<'PY'
          from pathlib import Path
          script = Path('../operations/.qa/code-oss-source-edit.py')
          text = script.read_text()
          before = 'debugState: "inactive"' + "'"
          after = 'debugState: "inactive" |' + "'"
          assert text.count(before) == 2
          script.write_text(text.replace(before, after))
          PY
          python ../operations/.qa/code-oss-source-edit.py
          git diff --stat
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then exit 0; fi
          git config user.name 'Commander Chara'
          git config user.email '249489759+cmdr-chara@users.noreply.github.com'
          git add apps packages scripts
          git commit -m 'feat(editor): wire Code-OSS services into existing Synara surfaces'
          git push origin HEAD:refs/heads/feat/code-oss-existing-editor
