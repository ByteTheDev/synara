name: Code OSS editor integration QA
on:
  push:
    branches: [qa/code-oss-editor-20261014]
permissions:
  contents: read
concurrency:
  group: code-oss-editor-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  view-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --prefix /tmp/synara-view-probe electron@43.4.1 --no-audit --no-fund
      - name: Verify embedded view geometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/synara-qa
          cat > /tmp/synara-view-probe/main.cjs <<'JS'
          const { app, BrowserWindow, View, WebContentsView } = require('electron');
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const delay = () => new Promise(resolve => setTimeout(resolve, 200));
          app.commandLine.appendSwitch('no-sandbox');
          app.whenReady().then(async () => {
            const win = new BrowserWindow({ width:1100,height:780,show:true,webPreferences:{sandbox:true} });
            console.log('ORIGINAL CHILDREN',win.contentView.children.map(v=>({type:v.constructor.name,contents:v.webContents?.id,bounds:v.getBounds()})));
            const native = win.contentView.children.find(v => v instanceof WebContentsView && v.webContents === win.webContents);
            assert.ok(native,'actual BrowserWindow WebContentsView is accessible');
            const root = new View();
            const shell = new WebContentsView({ webPreferences:{sandbox:true} });
            win.setContentView(root);
            root.addChildView(shell);
            root.addChildView(native);
            shell.setBounds({x:0,y:0,width:1100,height:780});
            await shell.webContents.loadURL('data:text/html,<body>Synara shell</body>');
            await win.webContents.loadURL('data:text/html,<body>Native editor</body>');
            native.setBounds({x:300,y:100,width:450,height:350});
            await delay();
            const inspect = async () => ({nativeClass:native.constructor.name,children:root.children.map(v=>({type:v.constructor.name,bounds:v.getBounds()})),bounds:native.getBounds(),viewport:await win.webContents.executeJavaScript('({width:innerWidth,height:innerHeight})')});
            console.log('INITIAL',JSON.stringify(await inspect()));
            assert.deepEqual((await inspect()).viewport,{width:450,height:350});
            assert.equal(BrowserWindow.fromWebContents(win.webContents),win);
            native.setVisible(false);assert.equal(native.getVisible(),false);native.setVisible(true);
            native.setBounds({x:250,y:120,width:560,height:400});await delay();
            console.log('RESIZED',JSON.stringify(await inspect()));
            assert.deepEqual((await inspect()).viewport,{width:560,height:400});
            win.setSize(1200,820);await delay();
            console.log('WINDOW RESIZED',JSON.stringify(await inspect()));
            native.setBounds({x:250,y:120,width:560,height:400});await delay();
            assert.deepEqual((await inspect()).viewport,{width:560,height:400});
            fs.writeFileSync('/tmp/synara-qa/view-probe.json',JSON.stringify({passed:true,...await inspect()},null,2));
            shell.webContents.close();win.destroy();app.quit();
          }).catch(error=>{console.error(error);app.exit(1)});
          JS
          xvfb-run -a /tmp/synara-view-probe/node_modules/.bin/electron --no-sandbox /tmp/synara-view-probe/main.cjs 2>&1 | tee /tmp/synara-qa/view-probe.log
          test -f /tmp/synara-qa/view-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-oss-native-viewport-probe
          path: /tmp/synara-qa
          retention-days: 3
          if-no-files-found: error
