name: Native unbranded startup acceptance
on:
  push:
    branches: [codex/1919-single-app-code-oss]
    paths: [.github/workflows/code-oss-startup-acceptance.yml]
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 58a9dd608ce6468d0b2859dfaef108ad855dcae1
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          scope: full
          electron: 'false'
      - name: Finish isolated smoke cleanup and diagnostics
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const path = 'apps/desktop/code-oss/scripts/smoke.mjs';
          let text = fs.readFileSync(path, 'utf8');
          const before = '  await rm(home, { recursive: true, force: true });';
          if (text.split(before).length !== 2) throw Error('Smoke cleanup anchor changed');
          text = text.replace(before, '  await rm(home, { recursive: true, force: true, maxRetries: 10, retryDelay: 250 });');
          const snapshot = '    const state = await until(';
          text = text.replace(snapshot, '    await writeFile(join(output, "windows.json"), JSON.stringify(await application.evaluate(({ BrowserWindow }) => BrowserWindow.getAllWindows().map(w => ({ id: w.id, visible: w.isVisible(), url: w.webContents.getURL(), title: w.getTitle() }))), null, 2));\n' + snapshot);
          const skip = '    const inputs = agent.locator(\'[contenteditable="true"]\');';
          text = text.replace(skip, '    const skipSetup = agent.getByRole("button", { name: "Skip setup", exact: true });\n    if (await skipSetup.isVisible()) await skipSetup.click();\n' + skip);
          fs.writeFileSync(path, text);
          JS
      - name: Format final touched source only
        run: node_modules/.bin/oxfmt apps/web/src/components/DesktopIdeCoordinator.tsx apps/desktop/code-oss/scripts/smoke.mjs apps/desktop/code-oss/overlay/src/vs/synara/electron-browser/onboarding.ts
      - name: Export exact final source
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const paths = ['apps/web/src/components/DesktopIdeCoordinator.tsx', 'apps/desktop/code-oss/scripts/smoke.mjs', 'apps/desktop/code-oss/overlay/src/vs/synara/electron-browser/onboarding.ts'];
          fs.writeFileSync('final-manifest.json', JSON.stringify(paths.map(path => ({path, sha256:crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex')})), null, 2));
          execFileSync('tar', ['-czf', 'final-source.tar.gz', 'final-manifest.json', ...paths]);
          JS
      - uses: actions/upload-artifact@v7
        with:
          name: native-final-source
          path: final-source.tar.gz
          retention-days: 3
      - name: Verify changed formatting and web interface
        run: |
          rm final-manifest.json final-source.tar.gz
          bun run fmt:check
          bun run --cwd apps/web typecheck
  native:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 58a9dd608ce6468d0b2859dfaef108ad855dcae1
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: native-final-source
      - run: tar -xzf final-source.tar.gz
      - uses: ./.github/actions/setup-code-oss
        with:
          flavor: production
          arch: x64
      - name: Native interface check
        working-directory: .code-oss/source
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run typecheck-client
      - name: Preserve native runtime
        run: tar -czf code-oss-runtime.tar.gz -C .code-oss runtime
      - uses: actions/upload-artifact@v7
        with:
          name: native-unbranded-runtime
          path: code-oss-runtime.tar.gz
          retention-days: 3
      - uses: ./.github/actions/setup-workspace
        with:
          scope: full
          electron: 'true'
      - name: Build integrated Synara
        run: bun run build:desktop
      - name: Real Linux display
        run: sudo apt-get update && sudo apt-get install -y xvfb scrot libasound2t64 libgtk-3-0t64 libnss3 libgbm1
      - name: Actual native application acceptance
        env:
          SYNARA_SMOKE_OUTPUT: .code-oss/screenshots
        run: xvfb-run -a -s '-screen 0 1440x1000x24' node apps/desktop/code-oss/scripts/smoke.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-unbranded-screenshots
          path: .code-oss/screenshots
          retention-days: 7
          if-no-files-found: warn
  blobs:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: native-final-source
      - name: Validate source archive as data
        run: |
          python - <<'PY'
          import tarfile, pathlib
          with tarfile.open('final-source.tar.gz') as archive:
              for item in archive.getmembers():
                  path = pathlib.PurePosixPath(item.name)
                  if not item.isfile() or path.is_absolute() or '..' in path.parts or item.size > 100000:
                      raise ValueError('Invalid source member')
              archive.extractall('source', filter='data')
          PY
      - name: Create source blobs only; connector owns publication
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const manifest = JSON.parse(fs.readFileSync('source/final-manifest.json', 'utf8'));
            const allowed = new Set(['apps/web/src/components/DesktopIdeCoordinator.tsx', 'apps/desktop/code-oss/scripts/smoke.mjs', 'apps/desktop/code-oss/overlay/src/vs/synara/electron-browser/onboarding.ts']);
            const blobs = [];
            if (!Array.isArray(manifest) || manifest.length !== 3) throw Error('Invalid manifest');
            for (const item of manifest) {
              if (!allowed.delete(item.path)) throw Error('Unexpected path');
              const bytes = fs.readFileSync('source/' + item.path);
              if (crypto.createHash('sha256').update(bytes).digest('hex') !== item.sha256) throw Error('Content mismatch');
              const {data} = await github.rest.git.createBlob({...context.repo, content:bytes.toString('base64'), encoding:'base64'});
              blobs.push({...item, sha:data.sha, mode:'100644', type:'blob'});
            }
            fs.writeFileSync('final-blobs.json', JSON.stringify(blobs, null, 2));
      - uses: actions/upload-artifact@v7
        with:
          name: native-final-blobs
          path: final-blobs.json
          retention-days: 3
