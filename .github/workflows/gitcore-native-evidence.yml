name: GitCore native filesystem evidence

on:
  push:
    branches:
      - cleanup/20261012/gitcore-status-scope-validation

permissions:
  contents: read

concurrency:
  group: gitcore-native-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: GitCore 151 cases (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Check out exact reviewed application
        uses: actions/checkout@v6
        with:
          ref: c2ad55894c40d46f6685d332cc87cb6365c6d0a4
          persist-credentials: false
      - name: Check out isolated evidence driver
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .pr-driver
          persist-credentials: false
      - name: Materialize committed source bytes
        shell: bash
        run: |
          # This affects checkout bytes only. Runtime Git configuration, including
          # the Windows runner's autocrlf default, remains unchanged for the tests.
          for checkout in . .pr-driver; do
            # Discard cached checkout stat information before rewriting every blob.
            git -C "$checkout" read-tree HEAD
            git -C "$checkout" -c core.autocrlf=false checkout-index --force --all --index
          done
      - name: Install the source's frozen runtime workspace
        uses: ./.github/actions/setup-workspace
        with:
          scope: runtime
          electron: "false"
      - name: Run all canonical GitCore tests and preserve receipts
        env:
          DRIVER_SHA: ${{ github.sha }}
          CI: "true"
        run: node .pr-driver/scripts/gitcore-native-evidence/runner.mjs
      - name: Upload source, native environment and unfiltered test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitcore-1847-${{ matrix.os }}
          path: gitcore-native-evidence/
          if-no-files-found: error
          retention-days: 14

  static:
    name: Focused format and complete server types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact reviewed application
        uses: actions/checkout@v6
        with:
          ref: c2ad55894c40d46f6685d332cc87cb6365c6d0a4
          persist-credentials: false
      - name: Check out isolated evidence driver
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .pr-driver
          persist-credentials: false
      - name: Install the source's frozen runtime workspace
        id: install
        uses: ./.github/actions/setup-workspace
        with:
          scope: runtime
          electron: "false"
      - name: Check the two repaired files with the canonical formatter
        id: format
        run: bun run fmt:check apps/server/src/git/Layers/GitCore.ts apps/server/src/git/Layers/GitCore.test.ts
      - name: Obtain bounded formatter proposals from owned copies
        if: always() && steps.install.outcome == 'success'
        env:
          DRIVER_SHA: ${{ github.sha }}
        run: node .pr-driver/scripts/gitcore-native-evidence/format-proposal.mjs
      - name: Check complete server types with the canonical script
        if: always() && steps.install.outcome == 'success'
        run: bun run --cwd apps/server typecheck
      - name: Require unchanged tracked source
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = c2ad55894c40d46f6685d332cc87cb6365c6d0a4
          test "$(git rev-parse 'HEAD^{tree}')" = 94a54e15174d904613abeae2380c04c30b00d448
          git diff --exit-code HEAD --
      - name: Upload the immutable formatter proposal receipt
        if: always() && steps.install.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gitcore-1847-format-proposal
          path: gitcore-format-evidence/proposal.json
          if-no-files-found: error
          retention-days: 14
