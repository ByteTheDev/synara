name: Computer engine work
on:
  push:
    branches: [work/computer-use-engine-1911]
permissions:
  contents: read
concurrency:
  group: computer-engine-work-1911
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Export pinned dependencies and runtimes
        shell: bash
        run: |
          mkdir -p /tmp/computer-engine-toolchain/bin
          cp -L "$(command -v bun)" /tmp/computer-engine-toolchain/bin/bun
          cp -L "$(command -v node)" /tmp/computer-engine-toolchain/bin/node
          find node_modules apps packages scripts -type d -name node_modules -prune -print0 | tar --null -T - -czf /tmp/computer-engine-toolchain/dependencies.tar.gz
          bun --version > /tmp/computer-engine-toolchain/versions.txt
          node --version >> /tmp/computer-engine-toolchain/versions.txt
      - uses: actions/upload-artifact@v4
        with:
          name: computer-engine-toolchain
          path: /tmp/computer-engine-toolchain
          retention-days: 3
          compression-level: 0
