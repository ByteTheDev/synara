name: Computer engine work
on:
  push:
    branches: [work/computer-use-engine-1911]
    paths: [.github/workflows/computer-engine-work.yml]
permissions:
  contents: read
concurrency:
  group: computer-engine-work-1911
  cancel-in-progress: true
jobs:
  playbooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preserve candidate transport
        run: |
          mkdir -p "$RUNNER_TEMP/playbook-input" "$RUNNER_TEMP/playbook-checks"
          cp .github/playbook-candidate-*.txt .github/apply-playbook-candidate.py .github/finalize-playbook-candidate.py "$RUNNER_TEMP/playbook-input/"
      - uses: actions/checkout@v6
        with:
          ref: 1200e08d7740a7b2a4ffb9f778a09285e0d03cfc
          persist-credentials: false
      - name: Verify exact candidate and two test-only corrections
        run: |
          python3 "$RUNNER_TEMP/playbook-input/apply-playbook-candidate.py" "$GITHUB_WORKSPACE"
          python3 "$RUNNER_TEMP/playbook-input/finalize-playbook-candidate.py" "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup-workspace
        with:
          scope: runtime
      - name: Recheck only corrected files formatting and lint
        run: |
          bun x --no-install oxfmt --check apps/server/src/agentGateway/computerAppPlaybooks.test.ts apps/server/src/agentGateway/computerTools.test.ts > "$RUNNER_TEMP/playbook-checks/fmt.log" 2>&1
          bun x --no-install oxlint apps/server/src/agentGateway/computerAppPlaybooks.test.ts apps/server/src/agentGateway/computerTools.test.ts > "$RUNNER_TEMP/playbook-checks/lint.log" 2>&1
      - name: Verify corrected regression suites
        run: |
          bun run --cwd apps/server test src/agentGateway/computerAppPlaybooks.test.ts src/agentGateway/computerTools.test.ts > "$RUNNER_TEMP/playbook-checks/tests.log" 2>&1
          tail -10 "$RUNNER_TEMP/playbook-checks/tests.log"
      - name: Complete remaining server typecheck
        shell: bash
        run: |
          set +e
          bun run typecheck -- --filter=@synara/cli --only --concurrency=1 > "$RUNNER_TEMP/playbook-checks/types.log" 2>&1
          code=$?
          echo "server_types=$code" | tee "$RUNNER_TEMP/playbook-checks/results.txt"
          tail -25 "$RUNNER_TEMP/playbook-checks/types.log"
          exit "$code"
      - name: Materialize verified blobs without commit or ref updates
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const manifest = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'playbook-input/validated-manifest.json'),'utf8'));
            if (manifest.base !== '1200e08d7740a7b2a4ffb9f778a09285e0d03cfc' || manifest.files.length !== 7) throw new Error('Unexpected candidate');
            for (const file of manifest.files) {
              const content = fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE,file.path));
              const sha = crypto.createHash('sha1').update(`blob ${content.length}\0`).update(content).digest('hex');
              if (sha !== file.sha || crypto.createHash('sha256').update(content).digest('hex') !== file.sha256) throw new Error(`Changed candidate: ${file.path}`);
              const result = await github.rest.git.createBlob({...context.repo,content:content.toString('base64'),encoding:'base64'});
              if (result.data.sha !== sha) throw new Error(`Blob mismatch: ${file.path}`);
            }
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'playbook-checks/blobs.json'),JSON.stringify(manifest,null,2));
            console.log('Seven reviewed blobs stored. No commit, branch, ref, release or PR changed.');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: computer-playbook-final-validation
          path: ${{ runner.temp }}/playbook-checks
          retention-days: 2
