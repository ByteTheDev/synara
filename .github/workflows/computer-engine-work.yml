name: Computer engine work
on:
  push:
    branches: [work/computer-use-engine-1911]
    paths: [.github/workflows/computer-engine-work.yml]
permissions:
  contents: read
concurrency:
  group: computer-engine-work-1911
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preserve candidate transport
        run: |
          mkdir -p "$RUNNER_TEMP/attachment-input" "$RUNNER_TEMP/attachment-checks"
          cp .github/attachment-candidate-*.b64 .github/attachment-candidate-manifest.json .github/apply-attachment-candidate.py .github/finalize-attachment-candidate.py "$RUNNER_TEMP/attachment-input/"
      - uses: actions/checkout@v6
        with:
          ref: 73868ddbd0670975a1e7b05c475172f4ca64cecf
          persist-credentials: false
      - name: Verify final candidate and retained test evidence
        run: |
          python3 "$RUNNER_TEMP/attachment-input/apply-attachment-candidate.py" "$GITHUB_WORKSPACE"
          python3 "$RUNNER_TEMP/attachment-input/finalize-attachment-candidate.py" "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup-workspace
      - name: Final formatting
        id: format
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun run fmt:check 2>&1 | tee "$RUNNER_TEMP/attachment-checks/format.log"
      - name: Verify type-only correction preserves executable server code
        id: emission
        shell: bash
        run: |
          bun -e 'const fs=require("node:fs");const p="apps/server/src/agentGateway/computerTools.ts";const after=fs.readFileSync(p,"utf8");const before=after.replace("let stoppedReason: \"no_usable_window\" | \"surface_not_settled\" | \"control_not_ready\" | undefined;", "let stoppedReason: \"no_usable_window\" | \"surface_not_settled\" | undefined;");if(before===after)throw Error("Missing exact type correction");const t=new Bun.Transpiler({loader:"ts"});if(t.transformSync(before)!==t.transformSync(after))throw Error("Runtime changed");console.log("Server type correction emits identical executable code to the 407-test passing candidate.");' | tee "$RUNNER_TEMP/attachment-checks/emission.log"
      - name: Final workspace and fixture typecheck
        id: types
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun run typecheck -- --concurrency=1 2>&1 | tee "$RUNNER_TEMP/attachment-checks/typecheck.log"
      - name: Record exact outcomes
        if: always()
        run: |
          printf 'format=%s\nemission=%s\ntypes=%s\n' '${{ steps.format.outcome }}' '${{ steps.emission.outcome }}' '${{ steps.types.outcome }}' >> "$RUNNER_TEMP/attachment-checks/results.txt"
          printf 'server=407 passed in run 38450890080; subsequent server edit is type-only\ndesktop=18 passed in run 38451547054; desktop files unchanged\nlint=passed in run 38451547054; only stoppedReason type union changed afterward\nwindows-runtime:check=passed in run 38450890080; process boundaries unchanged\n' >> "$RUNNER_TEMP/attachment-checks/results.txt"
          cp "$RUNNER_TEMP/attachment-input/validated-manifest.json" "$RUNNER_TEMP/attachment-checks/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attachment-readiness-complete-validation
          path: ${{ runner.temp }}/attachment-checks
          retention-days: 2
      - name: Require all final checks
        if: always()
        run: |
          test '${{ steps.format.outcome }}' = success
          test '${{ steps.emission.outcome }}' = success
          test '${{ steps.types.outcome }}' = success
  objects:
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preserve verified transport
        run: |
          mkdir -p "$RUNNER_TEMP/attachment-input" "$RUNNER_TEMP/attachment-objects"
          cp .github/attachment-candidate-*.b64 .github/attachment-candidate-manifest.json .github/apply-attachment-candidate.py .github/finalize-attachment-candidate.py "$RUNNER_TEMP/attachment-input/"
      - uses: actions/checkout@v6
        with:
          ref: 73868ddbd0670975a1e7b05c475172f4ca64cecf
          persist-credentials: false
      - name: Reconstruct exact validated source
        run: |
          python3 "$RUNNER_TEMP/attachment-input/apply-attachment-candidate.py" "$GITHUB_WORKSPACE"
          python3 "$RUNNER_TEMP/attachment-input/finalize-attachment-candidate.py" "$GITHUB_WORKSPACE"
      - name: Materialize verified blobs without publishing any ref
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const manifest = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'attachment-input/validated-manifest.json'),'utf8'));
            for (const file of manifest.files) {
              const content = fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE,file.path));
              const sha = crypto.createHash('sha1').update(`blob ${content.length}\0`).update(content).digest('hex');
              if (sha !== file.sha) throw new Error(`Changed candidate: ${file.path}`);
              const reply = await github.rest.git.createBlob({...context.repo,content:content.toString('base64'),encoding:'base64'});
              if (reply.data.sha !== sha) throw new Error(`Blob mismatch: ${file.path}`);
            }
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'attachment-objects/blobs.json'),JSON.stringify(manifest,null,2));
            console.log('Verified all 15 Git blobs. No branch, commit, ref, or PR was changed.');
      - uses: actions/upload-artifact@v4
        with:
          name: attachment-readiness-complete-objects
          path: ${{ runner.temp }}/attachment-objects
          retention-days: 2
