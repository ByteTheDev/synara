name: Computer engine work
on:
  push:
    branches: [work/computer-use-engine-1911]
    paths: [.github/workflows/computer-engine-work.yml]
permissions:
  contents: read
concurrency:
  group: computer-engine-work-1911
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 73868ddbd0670975a1e7b05c475172f4ca64cecf
          persist-credentials: false
      - name: Export exact published baseline
        run: |
          mkdir -p "$RUNNER_TEMP/baseline"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/baseline/source.tar.gz"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/baseline/identity.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: computer-use-published-baseline
          path: ${{ runner.temp }}/baseline
          retention-days: 2
