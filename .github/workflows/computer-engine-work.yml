name: Computer engine work
on:
  push:
    branches: [work/computer-use-engine-1911]
    paths: [.github/workflows/computer-engine-work.yml]
permissions:
  contents: read
concurrency:
  group: computer-engine-work-1911
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preserve candidate transport
        run: |
          mkdir -p "$RUNNER_TEMP/attachment-input" "$RUNNER_TEMP/attachment-checks"
          cp .github/attachment-candidate-*.b64 .github/attachment-candidate-manifest.json .github/apply-attachment-candidate.py .github/finalize-attachment-candidate.py "$RUNNER_TEMP/attachment-input/"
      - uses: actions/checkout@v6
        with:
          ref: 73868ddbd0670975a1e7b05c475172f4ca64cecf
          persist-credentials: false
      - name: Verify exact final candidate
        run: |
          python3 "$RUNNER_TEMP/attachment-input/apply-attachment-candidate.py" "$GITHUB_WORKSPACE"
          python3 "$RUNNER_TEMP/attachment-input/finalize-attachment-candidate.py" "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup-workspace
      - name: Formatting and lint for the only subsequent change
        id: static
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun x --no-install oxfmt --check apps/server/src/agentGateway/computerAttachmentTools.test.ts 2>&1 | tee "$RUNNER_TEMP/attachment-checks/format.log"
          bun x --no-install oxlint --report-unused-disable-directives apps/server/src/agentGateway/computerAttachmentTools.test.ts 2>&1 | tee "$RUNNER_TEMP/attachment-checks/lint.log"
      - name: Final attachment fixtures and NUL admission test
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun run --cwd apps/server test src/agentGateway/computerAttachmentTools.test.ts 2>&1 | tee "$RUNNER_TEMP/attachment-checks/attachment-tests.log"
      - name: Remaining complete server typecheck
        id: types
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun run --cwd apps/server typecheck 2>&1 | tee "$RUNNER_TEMP/attachment-checks/typecheck.log"
      - name: Record final evidence
        if: always()
        run: |
          printf 'static=%s\ntests=%s\ntypes=%s\n' '${{ steps.static.outcome }}' '${{ steps.tests.outcome }}' '${{ steps.types.outcome }}' >> "$RUNNER_TEMP/attachment-checks/results.txt"
          printf 'server-integrated=407 passed in run 38450890080; type-only runtime-equivalent stoppedReason edit verified in run 38452076265; final attachment fixtures rerun here\ndesktop=18 passed in run 38451547054; files unchanged\nworkspace-types=other 6 tasks passed in run 38452076265, including desktop fixtures; only attachment test fixture changed afterward\nformat=full check passed in run 38452076265, changed test rechecked here\nlint=full check passed in run 38451547054, changed test rechecked here\nwindows-runtime:check=passed in run 38450890080; boundaries unchanged\n' >> "$RUNNER_TEMP/attachment-checks/results.txt"
          cp "$RUNNER_TEMP/attachment-input/validated-manifest.json" "$RUNNER_TEMP/attachment-checks/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attachment-readiness-publish-validation
          path: ${{ runner.temp }}/attachment-checks
          retention-days: 2
      - name: Require final affected checks
        if: always()
        run: |
          test '${{ steps.static.outcome }}' = success
          test '${{ steps.tests.outcome }}' = success
          test '${{ steps.types.outcome }}' = success
  objects:
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preserve verified transport
        run: |
          mkdir -p "$RUNNER_TEMP/attachment-input" "$RUNNER_TEMP/attachment-objects"
          cp .github/attachment-candidate-*.b64 .github/attachment-candidate-manifest.json .github/apply-attachment-candidate.py .github/finalize-attachment-candidate.py "$RUNNER_TEMP/attachment-input/"
      - uses: actions/checkout@v6
        with:
          ref: 73868ddbd0670975a1e7b05c475172f4ca64cecf
          persist-credentials: false
      - name: Reconstruct exact validated source
        run: |
          python3 "$RUNNER_TEMP/attachment-input/apply-attachment-candidate.py" "$GITHUB_WORKSPACE"
          python3 "$RUNNER_TEMP/attachment-input/finalize-attachment-candidate.py" "$GITHUB_WORKSPACE"
      - name: Materialize verified blobs without publishing any ref
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const manifest = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'attachment-input/validated-manifest.json'),'utf8'));
            for (const file of manifest.files) {
              const content = fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE,file.path));
              const sha = crypto.createHash('sha1').update(`blob ${content.length}\0`).update(content).digest('hex');
              if (sha !== file.sha) throw new Error(`Changed candidate: ${file.path}`);
              const reply = await github.rest.git.createBlob({...context.repo,content:content.toString('base64'),encoding:'base64'});
              if (reply.data.sha !== sha) throw new Error(`Blob mismatch: ${file.path}`);
            }
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'attachment-objects/blobs.json'),JSON.stringify(manifest,null,2));
            console.log('Verified all 15 Git blobs. No branch, commit, ref, or PR was changed.');
      - uses: actions/upload-artifact@v4
        with:
          name: attachment-readiness-publish-objects
          path: ${{ runner.temp }}/attachment-objects
          retention-days: 2
