name: Computer engine work
on:
  push:
    branches: [work/computer-use-engine-1911]
    paths: [.github/workflows/computer-engine-work.yml]
permissions:
  contents: read
concurrency:
  group: computer-engine-work-1911
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preserve candidate transport
        run: |
          mkdir -p "$RUNNER_TEMP/engine-input"
          cp .github/computer-engine-candidate-*.json .github/apply-computer-engine-candidate.py "$RUNNER_TEMP/engine-input/"
      - uses: actions/checkout@v6
        with:
          ref: a83037154ec3f431004cadf92fec1a3cf9092a30
          persist-credentials: false
      - name: Verify and apply candidate
        run: python3 "$RUNNER_TEMP/engine-input/apply-computer-engine-candidate.py" "$GITHUB_WORKSPACE"
      - name: Materialize exact reviewed file objects without publishing a ref
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const manifest = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'engine-input/validated-manifest.json'),'utf8'));
            for (const file of manifest.files) {
              const content = fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE,file.path));
              const sha = crypto.createHash('sha1').update(`blob ${content.length}\0`).update(content).digest('hex');
              if (sha !== file.sha) throw new Error(`Changed candidate: ${file.path}`);
              const reply = await github.rest.git.createBlob({...context.repo,content:content.toString('base64'),encoding:'base64'});
              if (reply.data.sha !== sha) throw new Error(`Blob mismatch: ${file.path}`);
            }
            fs.mkdirSync(path.join(process.env.RUNNER_TEMP,'engine-evidence'),{recursive:true});
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'engine-evidence/blobs.json'),JSON.stringify(manifest,null,2));
            console.log('Verified 19 blobs. No branch, commit, ref, or pull request was changed.');
      - uses: actions/upload-artifact@v4
        with:
          name: computer-engine-objects
          path: ${{ runner.temp }}/engine-evidence
          retention-days: 2
  validation:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: |
          mkdir -p "$RUNNER_TEMP/engine-input" "$RUNNER_TEMP/engine-checks"
          cp .github/computer-engine-candidate-*.json .github/apply-computer-engine-candidate.py "$RUNNER_TEMP/engine-input/"
      - uses: actions/checkout@v6
        with:
          ref: a83037154ec3f431004cadf92fec1a3cf9092a30
          persist-credentials: false
      - run: python3 "$RUNNER_TEMP/engine-input/apply-computer-engine-candidate.py" "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup-workspace
      - name: Repository formatting lint and Windows boundary checks
        id: static
        shell: bash
        run: |
          set +e
          failed=0
          for check in fmt:check lint windows-runtime:check; do
            bun run "$check" > "$RUNNER_TEMP/engine-checks/${check//:/-}.log" 2>&1
            code=$?; echo "$check=$code" | tee -a "$RUNNER_TEMP/engine-checks/results.txt"
            if [ "$code" -ne 0 ]; then failed=1; tail -60 "$RUNNER_TEMP/engine-checks/${check//:/-}.log"; fi
          done
          exit "$failed"
      - name: Integrated computer lifecycle and gateway tests
        id: tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          bun run --cwd apps/server test src/computer/ComputerManager.test.ts src/computer/ComputerApprovalGate.test.ts src/computer/ComputerApprovalGate.expiry.test.ts src/computer/CuaComputerBackend.test.ts src/computer/uiTreeTargeting.test.ts src/agentGateway/computerTools.test.ts src/agentGateway/computerProgressGuard.test.ts src/agentGateway/computerProgressGuard.expiry.test.ts src/agentGateway/computerForegroundConsent.test.ts src/agentGateway/computerForegroundConsent.expiry.test.ts src/agentGateway/computerGuidance.test.ts src/agentGateway/computerRecoveryGuidance.test.ts > "$RUNNER_TEMP/engine-checks/server-tests.log" 2>&1
          bun run --cwd apps/desktop test src/escapeKillSwitchMonitor.test.ts src/escapeKillSwitchMonitor.recovery.test.ts > "$RUNNER_TEMP/engine-checks/desktop-tests.log" 2>&1
      - name: Workspace typecheck
        id: types
        if: ${{ !cancelled() }}
        shell: bash
        run: bun run typecheck -- --concurrency=1 > "$RUNNER_TEMP/engine-checks/typecheck.log" 2>&1
      - name: Record outcomes
        if: always()
        run: |
          printf 'static=%s\ntests=%s\ntypes=%s\n' '${{ steps.static.outcome }}' '${{ steps.tests.outcome }}' '${{ steps.types.outcome }}' >> "$RUNNER_TEMP/engine-checks/results.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: computer-engine-validation
          path: ${{ runner.temp }}/engine-checks
          retention-days: 2
  native:
    needs: candidate
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CUA_DRIVER_RS_TELEMETRY_ENABLED: '0'
      CARGO_PROFILE_DEV_STRIP: none
      CARGO_PROFILE_TEST_STRIP: none
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: |
          mkdir -p "$RUNNER_TEMP/engine-input" "$RUNNER_TEMP/native-checks"
          cp .github/computer-engine-candidate-*.json .github/apply-computer-engine-candidate.py "$RUNNER_TEMP/engine-input/"
      - uses: actions/checkout@v6
        with:
          ref: a83037154ec3f431004cadf92fec1a3cf9092a30
          persist-credentials: false
      - run: python3 "$RUNNER_TEMP/engine-input/apply-computer-engine-candidate.py" "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v6
        with:
          repository: trycua/cua
          ref: 7fe7c33f741ee2dd5961ba80044d59f93b48ba47
          persist-credentials: false
          path: native
          sparse-checkout: libs/cua-driver
      - name: Prepare revision 40 native source
        shell: bash
        run: |
          release=packages/shared/src/cuaDriverRelease.json
          test "$(shasum -a 256 apps/desktop/patches/cua-driver/0001-synara-native.patch | cut -d ' ' -f 1)" = "$(jq -r .patchSha256 "$release")"
          git -C native apply --check "$GITHUB_WORKSPACE/apps/desktop/patches/cua-driver/0001-synara-native.patch"
          git -C native apply "$GITHUB_WORKSPACE/apps/desktop/patches/cua-driver/0001-synara-native.patch"
          rustup toolchain install "$(jq -r .rustVersion "$release")" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$(jq -r .rustVersion "$release")" >> "$GITHUB_ENV"
      - name: Compile native macOS tests
        id: compile
        run: cargo check --manifest-path native/libs/cua-driver/rust/Cargo.toml --locked -p platform-macos --tests > "$RUNNER_TEMP/native-checks/compile.log" 2>&1
      - name: Run native text regressions
        id: tests
        run: cargo test --manifest-path native/libs/cua-driver/rust/Cargo.toml --locked -p platform-macos --lib tools::type_text::tests > "$RUNNER_TEMP/native-checks/text-tests.log" 2>&1
      - if: always()
        run: printf 'compile=%s\ntests=%s\n' '${{ steps.compile.outcome }}' '${{ steps.tests.outcome }}' > "$RUNNER_TEMP/native-checks/results.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: computer-engine-native-validation
          path: ${{ runner.temp }}/native-checks
          retention-days: 2
