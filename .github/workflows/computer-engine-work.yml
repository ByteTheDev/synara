name: Computer engine work
on:
  push:
    branches: [work/computer-use-engine-1911]
permissions:
  contents: read
  actions: read
concurrency:
  group: computer-engine-work-1911
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: 38434751063
          name: computer-engine-toolchain
          path: /tmp/computer-engine-toolchain
      - run: split -b 350M /tmp/computer-engine-toolchain/dependencies.tar.gz /tmp/dependencies.part-
      - uses: actions/upload-artifact@v4
        with:
          name: dependencies-aa
          path: /tmp/dependencies.part-aa
          retention-days: 2
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: dependencies-ab
          path: /tmp/dependencies.part-ab
          retention-days: 2
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: dependencies-ac
          path: /tmp/dependencies.part-ac
          retention-days: 2
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: engine-runtimes
          path: |
            /tmp/computer-engine-toolchain/bin
            /tmp/computer-engine-toolchain/versions.txt
          retention-days: 2
