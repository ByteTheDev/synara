name: Computer engine work
on:
  push:
    branches: [work/computer-use-engine-1911]
permissions:
  contents: read
concurrency:
  group: computer-engine-work-1911
  cancel-in-progress: true
jobs:
  native-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          path: synara
      - uses: actions/checkout@v6
        with:
          repository: trycua/cua
          ref: 7fe7c33f741ee2dd5961ba80044d59f93b48ba47
          persist-credentials: false
          path: native
          sparse-checkout: libs/cua-driver
      - name: Apply pinned patch and export driver source
        run: |
          cd native
          git apply ../synara/apps/desktop/patches/cua-driver/0001-synara-native.patch
          mkdir -p /tmp/native-engine
          tar -czf /tmp/native-engine/native-source.tar.gz libs/cua-driver/rust
      - uses: actions/upload-artifact@v4
        with:
          name: native-engine-source
          path: /tmp/native-engine
          retention-days: 2
