name: Computer engine work
on:
  push:
    branches: [work/computer-use-engine-1911]
    paths: [.github/workflows/computer-engine-work.yml]
permissions:
  contents: read
concurrency:
  group: computer-engine-work-1911
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 1200e08d7740a7b2a4ffb9f778a09285e0d03cfc
          persist-credentials: false
      - name: Export immutable PR source
        run: |
          mkdir -p "$RUNNER_TEMP/playbook-source"
          git rev-parse HEAD > "$RUNNER_TEMP/playbook-source/head.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/playbook-source/source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: computer-playbook-source
          path: ${{ runner.temp }}/playbook-source
          retention-days: 2
