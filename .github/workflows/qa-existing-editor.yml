name: Existing editor integration evidence
on:
  push:
    branches: [codex/code-oss-existing-editor-qa]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: local-test-tools
          run-id: 38599398894
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tools-export
      - name: Split export and restore pinned tools
        run: |
          mkdir "$RUNNER_TEMP/tools-export/parts"
          split -b 400m "$RUNNER_TEMP/tools-export/synara-deps.tar.gz" "$RUNNER_TEMP/tools-export/parts/deps-"
          tar -xzf "$RUNNER_TEMP/tools-export/synara-deps.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: local-test-deps-1
          compression-level: 0
          path: ${{ runner.temp }}/tools-export/parts/deps-aa
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: local-test-deps-2
          compression-level: 0
          path: |
            ${{ runner.temp }}/tools-export/parts/deps-ab
            ${{ runner.temp }}/tools-export/test-tools.tar.gz
          retention-days: 3
      - name: Check explicit ownership restoration
        run: |
          cat > "$RUNNER_TEMP/view-contract.cjs" <<'JS'
          const { app, BrowserWindow, WebContentsView, View } = require('electron');
          const fs = require('node:fs');
          const capture = file => process.env.RUNNER_TEMP + '/' + file;
          app.whenReady().then(async () => {
            const win = new BrowserWindow({ width: 1000, height: 700, show: false });
            const original = win.webContents;
            const originalId = original.id;
            const root = new View();
            win.setContentView(root);
            const shell = new WebContentsView();
            root.addChildView(shell);
            original._setOwnerWindow(null);
            const editor = new WebContentsView({ webContents: original });
            root.addChildView(editor);
            original._setOwnerWindow(win);
            shell.setBounds({ x: 0, y: 0, width: 1000, height: 700 });
            editor.setBounds({ x: 200, y: 100, width: 400, height: 300 });
            await shell.webContents.loadURL('data:text/html,<body style="background:lightblue">Synara shell</body>');
            await original.loadURL('data:text/html,<body style="background:lightgreen"><textarea>Embedded editor</textarea></body>');
            console.log('IDENTITY', win.webContents === original, original.id, originalId, BrowserWindow.fromWebContents(original)?.id, win.id);
            if (win.webContents !== original || original.id !== originalId || BrowserWindow.fromWebContents(original) !== win) throw new Error('Workbench identity or ownership changed');
            win.show();
            await new Promise(resolve => setTimeout(resolve, 300));
            const first = await original.executeJavaScript('({width:innerWidth,height:innerHeight})');
            console.log('FIRST_VIEWPORT', first);
            if (first.width !== 400 || first.height !== 300) throw new Error('Initial bounds failed');
            await original.executeJavaScript('document.querySelector("textarea").value = "UNSAVED_NATIVE_BUFFER"');
            editor.setVisible(false);
            if (original.isDestroyed()) throw new Error('Hiding destroyed editor');
            editor.setVisible(true);
            win.setSize(1200, 800);
            editor.setBounds({ x: 300, y: 200, width: 500, height: 400 });
            await new Promise(resolve => setTimeout(resolve, 200));
            const viewport = await original.executeJavaScript('({width:innerWidth,height:innerHeight,value:document.querySelector("textarea").value})');
            if (viewport.width !== 500 || viewport.height !== 400 || viewport.value !== 'UNSAVED_NATIVE_BUFFER') throw new Error('Retained viewport failed: ' + JSON.stringify(viewport));
            fs.writeFileSync(capture('view-contract.json'), JSON.stringify({ sameContents: true, originalId, ownerId: BrowserWindow.fromWebContents(original).id, root: win.contentView.constructor.name, children: root.children.map(view => view.constructor.name), bounds: editor.getBounds(), viewport }));
            fs.writeFileSync(capture('view-contract.png'), (await original.capturePage()).toPNG());
            console.log('RETAINED_NATIVE_VIEW_PASS', viewport);
            shell.webContents.close();
            win.destroy();
            app.quit();
          }).catch(error => { console.error(error); app.exit(1); });
          JS
          xvfb-run -a apps/desktop/node_modules/.bin/electron --no-sandbox "$RUNNER_TEMP/view-contract.cjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-view-contract
          path: |
            ${{ runner.temp }}/view-contract.json
            ${{ runner.temp }}/view-contract.png
          retention-days: 3
