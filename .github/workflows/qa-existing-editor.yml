name: Existing editor integration evidence
on:
  push:
    branches: [codex/code-oss-existing-editor-qa]
    paths: ['.github/workflows/qa-existing-editor.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare native integration candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('apps/desktop/code-oss/overlay/src/vs/synara/electron-main/host.ts')
          p.write_text(p.read_text().replace('  canQuit(): boolean;', '  canQuit(): boolean;\n  canCreateWindow(): boolean;'))
          p=Path('apps/desktop/code-oss/scripts/prepare.mjs')
          p.write_text(p.read_text().replace('protocol: 1,', 'protocol: 2,'))
          p=Path('apps/desktop/code-oss/overlay/src/vs/synara/electron-browser/onboarding.ts')
          p.write_text(p.read_text().replace('{ kind: "mode", value: "agent" }', '{ kind: "focus-agent" }'))
          p=Path('apps/desktop/code-oss/patches.json')
          patches=json.loads(p.read_text())
          for patch in patches:
            if patch['path']=='src/vs/platform/windows/electron-main/windowImpl.ts':
              patch['edits'].append({'before':'\t\t\tthis._win = new electron.BrowserWindow(options);','after':'\t\t\tif (synaraHost() && !synaraHost()!.canCreateWindow()) { throw new Error("Open files and projects in Synara’s existing editor; separate IDE windows are disabled."); }\n\t\t\tthis._win = new electron.BrowserWindow(options);'})
            if patch['path']=='src/vs/code/electron-main/app.ts':
              for edit in patch['edits']:
                if edit['before']=='contents.setWindowOpenHandler(details => {':
                  edit['after']="contents.setWindowOpenHandler(details => {\n\t\t\t\tif (synaraHost()) { return { action: 'deny' }; } // No auxiliary IDE windows in the embedded application."
          patches.append({'path':'build/lib/fetch.ts','edits':[{'before':"ghApiHeaders.Authorization = 'Basic ' + Buffer.from(process.env.GITHUB_TOKEN).toString('base64');",'after':"ghApiHeaders.Authorization = 'Bearer ' + process.env.GITHUB_TOKEN;"}]})
          p.write_text(json.dumps(patches,indent=2)+'\n')
          PY
      - uses: ./.github/actions/setup-code-oss
        id: native-build
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          flavor: production
          arch: x64
      - name: Typecheck pinned native overlay
        id: native-types
        if: always()
        continue-on-error: true
        working-directory: .code-oss/source
        env:
          GOMEMLIMIT: 10GiB
        run: |
          node -e 'require("fs").writeFileSync("tsconfig.synara.json", JSON.stringify({extends:"./src/tsconfig.json",include:["src/vs/synara/**/*.ts","src/typings","src/vscode-dts/vscode.d.ts","src/vscode-dts/vscode.proposed.*.d.ts"]}))'
          node node_modules/@typescript/native/bin/tsc --noEmit --project tsconfig.synara.json 2>&1 | tee "$RUNNER_TEMP/native-types.log"
      - name: Export native runtime and rebuild sources
        if: always()
        run: |
          mkdir "$RUNNER_TEMP/native-export"
          if test -f .code-oss/runtime/synara-runtime.json; then
            tar -czf "$RUNNER_TEMP/native-export/runtime.tar.gz" -C .code-oss runtime
            split -b 400m "$RUNNER_TEMP/native-export/runtime.tar.gz" "$RUNNER_TEMP/native-export/runtime-"
          fi
          tar --exclude=./.git --exclude=./out-synara --exclude=./.build --exclude=./extensions --exclude=./remote --exclude=./test --exclude=./.vscode -czf "$RUNNER_TEMP/native-export/source.tar.gz" -C .code-oss/source .
          split -b 400m "$RUNNER_TEMP/native-export/source.tar.gz" "$RUNNER_TEMP/native-export/source-"
          sha256sum "$RUNNER_TEMP/native-export/"*.tar.gz > "$RUNNER_TEMP/native-export/checksums.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-native-runtime-1
          compression-level: 0
          path: ${{ runner.temp }}/native-export/runtime-aa
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-native-runtime-2
          compression-level: 0
          path: ${{ runner.temp }}/native-export/runtime-ab
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-native-source-1
          compression-level: 0
          path: ${{ runner.temp }}/native-export/source-aa
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-native-source-2
          compression-level: 0
          path: ${{ runner.temp }}/native-export/source-ab
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-native-source-3
          compression-level: 0
          path: ${{ runner.temp }}/native-export/source-ac
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-native-build-checks
          path: |
            ${{ runner.temp }}/native-types.log
            ${{ runner.temp }}/native-export/checksums.txt
          retention-days: 3
      - name: Require native build and types
        if: steps.native-types.outcome == 'failure' || steps.native-build.outcome == 'failure'
        run: exit 1
