name: Observe actual current-main Dock icon for PR 452
on:
  push:
    branches: [cleanup/20261011/mac-dock-452-evidence]
    paths:
      - .github/workflows/mac-dock-capture.yml
      - .github/scripts/mac-dock-capture.mjs
      - .github/scripts/mac-dock-lifecycle.swift
permissions:
  contents: read
concurrency:
  group: mac-dock-capture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build_mac_icon:
    name: Compile exact-main Icon Composer catalog
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ec8c940e07582454a475250ade40147e3c89d59f
          persist-credentials: false
      - name: Compile and fingerprint current-main production icon
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ec8c940e07582454a475250ade40147e3c89d59f
          git diff --exit-code HEAD --
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          xcodebuild -version
          mkdir -p "$RUNNER_TEMP/mac-dock-icon"
          xcrun actool assets/prod/Synara.icon --compile "$RUNNER_TEMP/mac-dock-icon" --platform macosx --minimum-deployment-target 26.0 --app-icon Synara --include-all-app-icons --output-partial-info-plist "$RUNNER_TEMP/icon-partial.plist" --output-format human-readable-text
          test -s "$RUNNER_TEMP/mac-dock-icon/Assets.car"
          printf '%s\n' ec8c940e07582454a475250ade40147e3c89d59f > "$RUNNER_TEMP/mac-dock-icon/source-commit.txt"
          (
            cd "$RUNNER_TEMP/mac-dock-icon"
            shasum -a 256 Assets.car > Assets.car.sha256
          )
          git diff --exit-code HEAD --
      - uses: actions/upload-artifact@v7
        with:
          name: mac-dock-icon-${{ github.sha }}
          path: ${{ runner.temp }}/mac-dock-icon
          retention-days: 14
          if-no-files-found: error
  capture:
    needs: build_mac_icon
    name: Actual Dock lifecycle on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      SYNARA_DESKTOP_SIGNED: "false"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      SYNARA_DISABLE_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ec8c940e07582454a475250ade40147e3c89d59f
          path: source
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: diliprt/synara
          ref: 01ca9a62f8bb222dda23d8c68181acdbf5ddd1fb
          path: author
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: source/package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: source/package.json
      - name: Download current-run exact-main icon catalog
        uses: actions/download-artifact@v8
        with:
          name: mac-dock-icon-${{ github.sha }}
          path: ${{ runner.temp }}/mac-dock-icon
      - name: Verify icon source and integrity before building
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/mac-dock-icon/source-commit.txt")" = ec8c940e07582454a475250ade40147e3c89d59f
          (
            cd "$RUNNER_TEMP/mac-dock-icon"
            shasum -a 256 -c Assets.car.sha256
          )
          printf 'SYNARA_MAC_ICON_CATALOG=%s\n' "$RUNNER_TEMP/mac-dock-icon/Assets.car" >> "$GITHUB_ENV"
      - name: Compile native observer and verify existing display access
        id: prepare
        run: node ../driver/.github/scripts/mac-dock-capture.mjs prepare
      - name: Install frozen native packaging toolchain
        run: |
          set -euo pipefail
          dock_rust_version=$(node -p 'require("./packages/shared/src/cuaDriverRelease.json").rustVersion')
          rustup toolchain install "$dock_rust_version" --profile minimal
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$dock_rust_version" >> "$GITHUB_ENV"
          bun install --frozen-lockfile --ignore-scripts --filter '!@synara/marketing' 2>&1 | tee "$DOCK_EVIDENCE/install.log"
      - name: Build unchanged exact-main unsigned macOS application
        id: build
        timeout-minutes: 35
        run: |
          set -euo pipefail
          dock_version=$(node -p 'require("./apps/server/package.json").version')
          dock_lock=$(shasum -a 256 bun.lock | cut -d ' ' -f 1)
          bun run dist:desktop:artifact -- --platform mac --target dmg --arch arm64 --flavor production \
            --build-version "$dock_version" --source-commit ec8c940e07582454a475250ade40147e3c89d59f \
            --lockfile-sha256 "$dock_lock" --verbose --output-dir "$RUNNER_TEMP/mac-dock-packages" \
            2>&1 | tee "$DOCK_EVIDENCE/build.log"
      - name: Keep canonical packaged imports and isolated startup assertions
        id: startup
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          dock_version=$(node -p 'require("./apps/server/package.json").version')
          node scripts/verify-packaged-desktop-startup.ts --assets-dir "$RUNNER_TEMP/mac-dock-packages" \
            --platform mac --arch arm64 --version "$dock_version" 2>&1 | tee "$DOCK_EVIDENCE/canonical-startup.log"
      - name: Capture actual closed, running and normally quit Dock icon
        id: capture
        if: ${{ !cancelled() && steps.startup.outcome == 'success' }}
        run: node ../driver/.github/scripts/mac-dock-capture.mjs capture
      - name: Restore disposable Dock state and unregister only the owned application
        id: cleanup
        if: always()
        run: node ../driver/.github/scripts/mac-dock-capture.mjs cleanup
      - name: Require actual lifecycle, clean source and retained screenshots
        if: always()
        env:
          DOCK_BUILD_OUTCOME: ${{ steps.build.outcome }}
          DOCK_STARTUP_OUTCOME: ${{ steps.startup.outcome }}
          DOCK_CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          DOCK_CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: node ../driver/.github/scripts/mac-dock-capture.mjs verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mac-dock-452-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/mac-dock-evidence
          retention-days: 14
          if-no-files-found: error
