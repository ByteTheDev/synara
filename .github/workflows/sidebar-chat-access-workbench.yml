name: Sidebar chat access workbench
on:
  push:
    branches: [codex/sidebar-chat-access-workbench]
    paths: ['.workbench/**', '.github/workflows/sidebar-chat-access-workbench.yml']
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 10
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38436818649
          name: sidebar-access-verification
          path: output/sidebar-access
      - name: Prepare explicit unread completion fixture
        run: python3 scripts/sidebar-chat-access-finalize.py prepare
      - uses: ./.github/actions/setup-workspace
        with:
          scope: full
      - name: Check changed fixture and formatting
        run: python3 scripts/sidebar-chat-access-finalize.py checks
      - name: Install browser and video encoder
        run: |
          (cd apps/web && bunx playwright install --with-deps chromium)
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Verify the two corrected unread and navigation journeys
        run: python3 scripts/sidebar-chat-access-finalize.py browser
      - name: Export final candidate objects without changing any branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/sidebar-chat-access-finalize.py export
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidebar-access-verification
          path: output/sidebar-access
          retention-days: 7
      - name: Require successful validation
        run: python3 scripts/sidebar-chat-access-finalize.py gate
