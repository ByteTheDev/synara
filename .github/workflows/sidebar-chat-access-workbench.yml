name: Sidebar chat access workbench
on:
  push:
    branches: [codex/sidebar-chat-access-workbench]
    paths: ['.workbench/**', '.github/workflows/sidebar-chat-access-workbench.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Apply focused candidate and corrected fixtures
        run: python3 scripts/sidebar-chat-access-workbench.py prepare
      - uses: ./.github/actions/setup-workspace
        with:
          scope: full
      - name: Final format, lint, and type checks
        run: python3 scripts/sidebar-chat-access-workbench.py checks
      - name: Install Chromium for actual app verification
        run: cd apps/web && bunx playwright install --with-deps chromium
      - name: Verify sidebar, keyboard, responsive layout, and draft preservation
        run: python3 scripts/sidebar-chat-access-workbench.py browser
      - name: Capture before, after, and real browser interactions
        continue-on-error: true
        run: python3 scripts/sidebar-chat-access-workbench.py capture
      - name: Export reviewed candidate objects without changing any branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/sidebar-chat-access-workbench.py export
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidebar-access-verification
          path: output/sidebar-access
          retention-days: 7
      - name: Require successful validation
        run: python3 scripts/sidebar-chat-access-workbench.py gate
