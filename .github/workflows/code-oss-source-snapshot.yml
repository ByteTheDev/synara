name: Code OSS integration source snapshot

on:
  push:
    branches: [codex/1919-single-app-code-oss]
    paths: [.github/workflows/code-oss-source-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vscode
          ref: 7baac39ec3ca969dab74ac12c097f6a486e46593
          persist-credentials: false
      - name: Export pinned upstream source for isolated integration development
        run: git archive --format=tar.gz --output=code-oss-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: code-oss-upstream-source
          path: code-oss-source.tar.gz
          retention-days: 1
          if-no-files-found: error
