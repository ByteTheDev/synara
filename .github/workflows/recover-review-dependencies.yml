name: Preserve pinned review dependencies
on:
  push:
    branches: [cleanup/20261011/review-dependency-recovery]
    paths:
      - .github/workflows/recover-review-dependencies.yml
      - .github/scripts/recover-review-dependencies.mjs
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: f73074c7a4e4145a8944292e2103964cdf83ecb8
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .review-dependency-driver
          persist-credentials: false
      - name: Install exact frozen workspace dependencies
        uses: ./.github/actions/setup-workspace
        with:
          scope: full
          electron: "false"
      - name: Preserve dependencies and exact provenance
        id: archive
        run: node .review-dependency-driver/.github/scripts/recover-review-dependencies.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: review-dependencies-f73074c-metadata
          path: |
            ${{ runner.temp }}/review-dependencies/provenance.json
            ${{ runner.temp }}/review-dependencies/bun
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: review-dependencies-f73074c-part-0
          path: ${{ runner.temp }}/review-dependencies/dependencies.part-0
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: ${{ fromJSON(steps.archive.outputs.parts) >= 2 }}
        with:
          name: review-dependencies-f73074c-part-1
          path: ${{ runner.temp }}/review-dependencies/dependencies.part-1
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: ${{ fromJSON(steps.archive.outputs.parts) >= 3 }}
        with:
          name: review-dependencies-f73074c-part-2
          path: ${{ runner.temp }}/review-dependencies/dependencies.part-2
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: ${{ fromJSON(steps.archive.outputs.parts) >= 4 }}
        with:
          name: review-dependencies-f73074c-part-3
          path: ${{ runner.temp }}/review-dependencies/dependencies.part-3
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
