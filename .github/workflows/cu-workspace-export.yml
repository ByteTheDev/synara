name: Computer reliability candidate validation

on:
  push:
    branches: [codex/cu-reliability-workspace-20261013]
    paths: [.github/workflows/cu-workspace-export.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fa2404553fd07fceb7e6acd90a882f1bb084da57
          persist-credentials: false
      - name: Apply hash-verified scoped source patches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cu-evidence"
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          shas = ['b930c0228699e7063ee0eda8890e38bff4fc4cec', '01f8b99a35d21505d8fc1c030c0c1c2d7727cff8', '8327ee64b0c17f2a9ec26dea89a92a83e183faa2', '8f1fc0aacfd48af114cded6c0854cab2970a3b3b', '1b75ed35c27db27f2bb75e32649c95cb99194ac3']
          for i, sha in enumerate(shas):
              result = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}']))
              data = base64.b64decode(result['content'])
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == sha
              path = pathlib.Path(os.environ['RUNNER_TEMP']) / f'cu-{i}.patch'
              path.write_bytes(data)
              subprocess.run(['git', 'apply', '--check', '--index', str(path)], check=True)
              subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          doc = pathlib.Path('docs/computer-use-cua/v2-parity-matrix.md')
          text = doc.read_text()
          old = 'Non text clipboard contents cannot be saved and are replaced.'
          assert text.count(old) == 1
          doc.write_text(text.replace(old, 'Unreadable clipboard is refused; newer text skips restoration.'))
          paths = subprocess.check_output(['git', 'diff', 'HEAD', '--name-only']).decode().splitlines()
          assert len(paths) == 17, paths
          assert all(p.startswith(('apps/server/src/', 'apps/desktop/src/', 'packages/contracts/src/', 'docs/computer-use-cua/')) for p in paths)
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'cu-evidence'
          (evidence / 'paths.txt').write_text('\n'.join(paths) + '\n')
          PY
      - uses: ./.github/actions/setup-workspace
      - name: Format only changed files
        shell: bash
        run: |
          git diff HEAD --name-only -z | xargs -0 ./node_modules/.bin/oxfmt --write
          git diff HEAD --check
      - name: Verify regression sensitivity against original production modules
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'cu-evidence'
          cases = [
              ('approval', 'apps/server', 'src/computer/ComputerApprovalGate.ts', 'src/computer/ComputerApprovalGate.recovery.test.ts', 'expires shared waiters'),
              ('foreground', 'apps/server', 'src/computer/CuaComputerBackend.ts', 'src/computer/CuaComputerBackend.test.ts', 'keeps an exact field token'),
              ('observation', 'apps/server', 'src/agentGateway/computerTools.ts', 'src/agentGateway/computerTools.test.ts', 'bounded exact-window observation|repeated scrolls with measured progress'),
              ('clipboard', 'apps/server', 'src/computer/ComputerManager.ts', 'src/agentGateway/computerTools.test.ts', 'overwrite an unreadable clipboard|restore over newer text'),
              ('listener', 'apps/desktop', 'src/escapeKillSwitchMonitor.ts', 'src/escapeKillSwitchMonitor.test.ts', 'restarts a silent armed helper'),
          ]
          for name, package, source, test, pattern in cases:
              path = pathlib.Path(package) / source
              saved = path.read_bytes()
              try:
                  path.write_bytes(subprocess.check_output(['git', 'show', f'HEAD:{path}']))
                  with (evidence / f'before-{name}.log').open('w') as log:
                      result = subprocess.run(['bun', 'run', '--cwd', package, 'test', test, '-t', pattern], stdout=log, stderr=subprocess.STDOUT, timeout=180)
                  with (evidence / 'before-results.tsv').open('a') as out:
                      out.write(f'{name}\t{result.returncode}\n')
              finally:
                  path.write_bytes(saved)
                  assert path.read_bytes() == saved
          PY
      - name: Integrated targeted verification
        shell: bash
        run: |
          EVIDENCE="$RUNNER_TEMP/cu-evidence"
          check() {
            local name="$1"; shift
            set +e
            "$@" 2>&1 | tee "$EVIDENCE/$name.log"
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\n' "$name" "$code" >> "$EVIDENCE/results.tsv"
          }
          check server-tests bun run --cwd apps/server test src/computer/ComputerApprovalGate.test.ts src/computer/ComputerApprovalGate.recovery.test.ts src/computer/CuaComputerBackend.test.ts src/computer/ComputerManager.test.ts src/agentGateway/computerTools.test.ts src/agentGateway/computerBrowserTools.test.ts src/agentGateway/computerGuidance.test.ts src/agentGateway/computerProgressGuard.test.ts src/agentGateway/computerForegroundConsent.test.ts
          check desktop-tests bun run --cwd apps/desktop test src/escapeKillSwitchMonitor.test.ts
          check formatting bun run fmt:check
          check lint bun run lint
          check typecheck bun run typecheck
          check windows-runtime bun run windows-runtime:check
      - name: Export candidate blobs and evidence without updating any branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'cu-evidence'
          expected = (evidence / 'paths.txt').read_text().splitlines()
          paths = subprocess.check_output(['git', 'diff', 'HEAD', '--name-only']).decode().splitlines()
          assert paths == expected, 'Unexpected tracked changes outside the candidate'
          subprocess.run(['git', 'diff', 'HEAD', '--check'], check=True)
          (evidence / 'candidate.patch').write_bytes(subprocess.check_output(['git', 'diff', 'HEAD', '--binary']))
          (evidence / 'status.txt').write_bytes(subprocess.check_output(['git', 'status', '--short']))
          manifest = {'parent': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(), 'files': []}
          for name in paths:
              data = pathlib.Path(name).read_bytes()
              payload = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              result = subprocess.run(['gh', 'api', '--method', 'POST', f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs', '--input', '-'], input=payload, text=True, capture_output=True, check=True)
              sha = json.loads(result.stdout)['sha']
              assert sha == hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              manifest['files'].append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha, 'sha256': hashlib.sha256(data).hexdigest()})
          (evidence / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          subprocess.run(['tar', '-czf', str(evidence / 'changed-files.tar.gz'), '-T', str(evidence / 'paths.txt')], check=True)
          print(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: computer-reliability-candidate
          path: ${{ runner.temp }}/cu-evidence/
          retention-days: 3
      - name: Report verification outcome
        if: always()
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/cu-evidence/results.tsv"
          cat "$RUNNER_TEMP/cu-evidence/results.tsv"
          awk -F '\t' 'BEGIN { n=0; failed=0 } { n++; if ($2 != "0") failed=1 } END { exit (n != 6 || failed) }' "$RUNNER_TEMP/cu-evidence/results.tsv"
