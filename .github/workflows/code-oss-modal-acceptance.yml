name: Native modal and IDE acceptance
on:
  push:
    branches: [codex/1919-single-app-code-oss]
    paths: [.github/workflows/code-oss-modal-acceptance.yml]
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cf747f77e272d7e6c472dfe58e1a70659b17b23e
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: native-renderer-source
          run-id: 38538975984
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: native-interaction-source
          run-id: 38540202833
          github-token: ${{ github.token }}
      - run: tar -xzf renderer-source.tar.gz && tar -xzf interaction-source.tar.gz
      - name: Preserve native modal ownership and restore meaningful session labels
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const paths=[];
          function edit(path,replacements) {
            let text=fs.readFileSync(path,'utf8');
            for(const [before,after] of replacements) {
              if(text.split(before).length!==2) throw Error('Source anchor changed: '+path+' '+before);
              text=text.replace(before,after);
            }
            fs.writeFileSync(path,text); paths.push(path);
          }
          edit('apps/desktop/code-oss/overlay/src/vs/synara/electron-browser/workbench.ts',[
            ['    let dialogOpen = false;\n    const occlusion = () => {\n      void request("overlay", quickInputOpen || dialogOpen);\n    };',`    let dialogOpen = false;
              let modalEditorOpen = false;
              let previousOverlay: boolean | undefined;
              const occlusion = () => {
                const open = quickInputOpen || dialogOpen || modalEditorOpen;
                if (open === previousOverlay) return;
                previousOverlay = open;
                void request("overlay", open);
              };
              // Upstream modal editors (Trust, Settings, Keybindings) are direct
              // workbench children. Native sibling views must not cover their UI.
              // Observe only that child list, never the editor text or agent DOM.
              const workbenchRoot = document.querySelector(".monaco-workbench");
              if (workbenchRoot) {
                const updateModal = () => {
                  modalEditorOpen = Array.from(workbenchRoot.children).some(child => child.classList.contains("monaco-modal-editor-block"));
                  occlusion();
                };
                const observer = new MutationObserver(updateModal);
                observer.observe(workbenchRoot, { childList: true });
                this._register(toDisposable(() => observer.disconnect()));
                updateModal();
              }`],
          ]);
          edit('apps/web/src/components/DesktopIdeCoordinator.tsx',[
            ['  const { focusedThreadId } = useFocusedChatContext();','  const { focusedThreadId, activeThread } = useFocusedChatContext();'],
            ['<SelectValue placeholder="Select an agent session" />','<SelectValue placeholder="Select an agent session">{activeThread?.title || sessions.find(thread => thread.id === focusedThreadId)?.title || (focusedThreadId ? "New session" : "Select an agent session")}</SelectValue>'],
          ]);
          edit('apps/desktop/code-oss/scripts/smoke.mjs',[
            ['    // Open through the actual Explorer, not through an injected editor or fixture UI.',`    // Trust is a native modal editor; dismiss its backdrop normally before
              // interacting with Explorer. Do not force-click through trust UI.
              const trustModal = workbench.locator(".monaco-modal-editor-block");
              if (await trustModal.isVisible()) {
                if (process.env.SYNARA_VERIFY_MODAL === "1") {
                  const agentVisible = await application.evaluate(({ BrowserWindow }) => BrowserWindow.getAllWindows().some(window => window.contentView.children.some(view => view.webContents?.getURL().startsWith("synara:") && view.getVisible())));
                  if (agentVisible) throw new Error("Agent native view covers a workbench modal");
                  await record("native modal editor occludes Agent view without unmounting it");
                }
                await trustModal.click({ position: { x: 4, y: 4 } });
                await trustModal.waitFor({ state: "hidden" });
              }
              // Open through the actual Explorer, not through an injected editor or fixture UI.`],
          ]);
          fs.writeFileSync('.modal-paths.json',JSON.stringify(paths));
          JS
      - uses: ./.github/actions/setup-workspace
        with:
          scope: full
          electron: 'false'
      - name: Format modified source and export exact hashes
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const paths=JSON.parse(fs.readFileSync('.modal-paths.json','utf8'));
          execFileSync('node_modules/.bin/oxfmt',paths,{stdio:'inherit'});
          fs.writeFileSync('modal-manifest.json',JSON.stringify(paths.map(path=>({path,sha256:crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex')})),null,2));
          execFileSync('tar',['-czf','modal-source.tar.gz','modal-manifest.json',...paths]);
          JS
      - uses: actions/upload-artifact@v7
        with:
          name: native-modal-source
          path: modal-source.tar.gz
          retention-days: 3
          if-no-files-found: error
      - name: Check changed renderer interface
        run: bun run --cwd apps/web typecheck
  native:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runtime: [existing, rebuilt]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cf747f77e272d7e6c472dfe58e1a70659b17b23e
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: native-renderer-source
          run-id: 38538975984
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: native-modal-source
      - run: tar -xzf renderer-source.tar.gz && tar -xzf modal-source.tar.gz
      - uses: actions/download-artifact@v8
        if: matrix.runtime == 'existing'
        with:
          name: native-service-runtime
          run-id: 38530755801
          github-token: ${{ github.token }}
          path: .code-oss
      - if: matrix.runtime == 'existing'
        run: tar -xzf .code-oss/code-oss-runtime.tar.gz -C .code-oss
      - uses: ./.github/actions/setup-code-oss
        if: matrix.runtime == 'rebuilt'
        with:
          flavor: production
          arch: x64
      - name: Native workbench interface validation
        if: matrix.runtime == 'rebuilt'
        working-directory: .code-oss/source
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run typecheck-client
      - name: Preserve rebuilt native runtime
        if: matrix.runtime == 'rebuilt'
        run: tar -czf code-oss-runtime.tar.gz -C .code-oss runtime
      - uses: actions/upload-artifact@v7
        if: matrix.runtime == 'rebuilt'
        with:
          name: native-modal-runtime
          path: code-oss-runtime.tar.gz
          retention-days: 3
          compression-level: 0
      - uses: ./.github/actions/setup-workspace
        with:
          scope: full
          electron: 'true'
      - run: node apps/desktop/code-oss/scripts/stage-browser-resources.mjs .code-oss/runtime
      - name: Build integrated desktop
        run: bun run build:desktop > .code-oss/build.log 2>&1 || { tail -80 .code-oss/build.log; exit 1; }
      - name: Preserve compiled Synara resources for subsequent harness-only checks
        run: tar -czf compiled-synara.tar.gz apps/desktop/dist-electron apps/server/dist apps/web/dist packages/contracts/dist
      - uses: actions/upload-artifact@v7
        with:
          name: compiled-synara-${{ matrix.runtime }}
          path: compiled-synara.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Real Linux desktop capture
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb scrot ffmpeg libasound2t64 libgtk-3-0t64 libnss3 libgbm1 > .code-oss/display.log 2>&1
      - name: Exercise native IDE and retained Agent
        timeout-minutes: 8
        env:
          SYNARA_SMOKE_OUTPUT: .code-oss/screenshots
          SYNARA_VERIFY_MODAL: ${{ matrix.runtime == 'rebuilt' && '1' || '0' }}
        run: xvfb-run -a -s '-screen 0 1440x1000x24' node apps/desktop/code-oss/scripts/smoke.mjs
      - name: Encode actual mode-switch GIF
        if: success()
        run: ffmpeg -y -i .code-oss/screenshots/agent-ide-switch.mp4 -vf 'fps=6,scale=960:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse' .code-oss/screenshots/agent-ide-switch.gif
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-modal-${{ matrix.runtime }}-evidence
          path: .code-oss/screenshots
          retention-days: 7
          if-no-files-found: warn
  report:
    needs: native
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: native-modal-*-evidence
          path: evidence
      - name: Summarize actual runtime results
        run: |
          find evidence -type f -name '*.json' -o -name 'failure.txt' | while read file; do echo "=== $file ==="; head -c 10000 "$file"; echo; done
          find evidence -name 'failure-page-1.txt' -exec head -c 10000 {} \;
          find evidence -name 'after-electron.log' -exec sh -c 'grep -E "ERR|Error|failed|not found|Cannot|SyntaxError" "$1" | tail -15 || true' sh {} \;
  blobs:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: native-modal-source
      - name: Validate source archive as data
        run: |
          python - <<'PY'
          import tarfile,pathlib
          with tarfile.open('modal-source.tar.gz') as archive:
              for item in archive.getmembers():
                  p=pathlib.PurePosixPath(item.name)
                  if not item.isfile() or p.is_absolute() or '..' in p.parts or item.size>50000:
                      raise ValueError('Unexpected source')
              archive.extractall('source',filter='data')
          PY
      - name: Store content-addressed blobs only
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('node:fs'),crypto=require('node:crypto');
            const allowed=new Set(['apps/desktop/code-oss/scripts/smoke.mjs','apps/desktop/code-oss/overlay/src/vs/synara/electron-browser/workbench.ts','apps/web/src/components/DesktopIdeCoordinator.tsx']);
            const manifest=JSON.parse(fs.readFileSync('source/modal-manifest.json','utf8'));
            if(!Array.isArray(manifest)||manifest.length!==allowed.size) throw Error('Invalid manifest');
            for(const item of manifest) {
              if(!allowed.delete(item.path)) throw Error('Unexpected path');
              const bytes=fs.readFileSync('source/'+item.path);
              if(crypto.createHash('sha256').update(bytes).digest('hex')!==item.sha256) throw Error('Content mismatch');
              const {data}=await github.rest.git.createBlob({...context.repo,content:bytes.toString('base64'),encoding:'base64'});
              console.log('MODAL_BLOB='+JSON.stringify({...item,sha:data.sha,mode:'100644',type:'blob'}));
            }
