name: Native OpenCode lifecycle qualification

on:
  push:
    branches:
      - codex/runtime-opencode-native-20261011
    paths:
      - .github/workflows/runtime-opencode-native.yml
      - .github/scripts/runtime-opencode-native/**

permissions:
  contents: read

concurrency:
  group: runtime-opencode-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Native OpenCode on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      # Preserve exact source bytes in the native Windows checkout.
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
    steps:
      - name: Checkout reviewed driver and pinned source ancestry
        uses: actions/checkout@v6
        with:
          # This child, the banner correction, the original driver, and source 872344c.
          fetch-depth: 4
          persist-credentials: false
      - name: Setup unchanged workspace
        uses: ./.github/actions/setup-workspace
        with:
          scope: runtime
      - name: Setup bounded archive reader
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify native CLI bytes and execute the exact opted-in adapter test
        run: node .github/scripts/runtime-opencode-native/runner.mjs
      - name: Retain original outcomes and source provenance including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opencode-native-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-opencode-native-evidence/
          if-no-files-found: error
          retention-days: 30
