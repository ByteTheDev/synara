name: Native existing editor acceptance
on:
  push:
    branches: [codex/1920-editor-surface-qa]
    paths: [.code-oss-work/editor-*.b64, .github/workflows/code-oss-existing-editor-acceptance.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Apply exact reviewed source changes as data
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {gunzipSync} from 'node:zlib';
          const sha=data=>crypto.createHash('sha256').update(data).digest('hex');
          const encoded=[1,2,3].map(n=>fs.readFileSync(`.code-oss-work/editor-${n}.b64`,'utf8').trim()).join('');
          const bytes=gunzipSync(Buffer.from(encoded,'base64'),{maxOutputLength:1000000});
          if(sha(bytes)!=='2992df50a1ab8c25c6885696a7f26736fc9f621d50947e3ea7daf83e6a67cf2a')throw Error('Transfer manifest checksum mismatch');
          const rows=JSON.parse(bytes);
          if(!Array.isArray(rows)||rows.length!==27)throw Error('Unexpected source count');
          const output=new Map();
          for(const row of rows){
            if(!/^(apps|packages|scripts)\//.test(row.path)||row.path.includes('..')||output.has(row.path))throw Error('Unexpected source path');
            const original=row.base===null?Buffer.alloc(0):fs.readFileSync(row.path);
            if(row.base===null?fs.existsSync(row.path):sha(original)!==row.base)throw Error('Source base changed: '+row.path);
            let text=original;
            let end=original.length;
            for(const [start,length,replacement] of [...row.edits].reverse()){
              if(!Number.isInteger(start)||!Number.isInteger(length)||start<0||length<0||start+length>end||typeof replacement!=='string')throw Error('Invalid edit');
              text=Buffer.concat([text.subarray(0,start),Buffer.from(replacement),text.subarray(start+length)]);
              end=start;
            }
            if(sha(text)!==row.result)throw Error('Source output mismatch: '+row.path);
            output.set(row.path,text);
          }
          for(const [name,bytes] of output){fs.mkdirSync(path.dirname(name),{recursive:true});fs.writeFileSync(name,bytes);}
          fs.writeFileSync('editor-paths.json',JSON.stringify([...output.keys()]));
          JS
      - uses: ./.github/actions/setup-workspace
        with:
          scope: full
          electron: 'false'
      - name: Format changed files and preserve exact source
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import crypto from 'node:crypto';import {execFileSync} from 'node:child_process';
          const paths=JSON.parse(fs.readFileSync('editor-paths.json','utf8'));
          execFileSync('node_modules/.bin/oxfmt',paths,{stdio:'inherit'});
          fs.writeFileSync('editor-manifest.json',JSON.stringify(paths.map(path=>({path,sha256:crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex')})),null,2));
          execFileSync('tar',['-czf','existing-editor-source.tar.gz','editor-manifest.json',...paths]);
          JS
      - uses: actions/upload-artifact@v7
        with:
          name: existing-editor-source
          path: existing-editor-source.tar.gz
          retention-days: 3
          if-no-files-found: error
  verify:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 85c70ad544f0409dc9051dde38c549530b2605ec
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: existing-editor-source
          path: .code-oss/prepared
      - run: tar -xzf .code-oss/prepared/existing-editor-source.tar.gz && mv editor-manifest.json .code-oss/prepared/
      - uses: ./.github/actions/setup-workspace
        with:
          scope: full
          electron: 'false'
      - name: Formatting
        id: fmt
        continue-on-error: true
        run: bun run fmt:check
      - name: Lint
        id: lint
        continue-on-error: true
        run: bun run lint
      - name: Workspace and direct desktop interfaces
        id: types
        continue-on-error: true
        run: bun run typecheck && bun run --cwd apps/desktop typecheck
      - name: Focused native bridge, existing editor and shared occlusion behavior
        id: tests
        continue-on-error: true
        run: |
          bun run --cwd packages/contracts test -- src/desktopIde.test.ts
          bun run --cwd apps/desktop test -- src/editorSurface.test.ts src/desktopRenderer.test.ts src/runningChatsQuitGuard.test.ts
          bun run test:web:focused src/components/EditorWorkspaceView.test.tsx src/components/BrowserPanel.logic.test.ts src/hasSelectorVariants.test.ts src/uiFontSize.test.ts
          bun run --cwd scripts test -- lib/code-oss-runtime.test.ts
      - name: Windows runtime boundary
        id: windows
        continue-on-error: true
        run: bun run windows-runtime:check
      - name: Enforce actual check outcomes
        if: always() && (steps.fmt.outcome != 'success' || steps.lint.outcome != 'success' || steps.types.outcome != 'success' || steps.tests.outcome != 'success' || steps.windows.outcome != 'success')
        run: exit 1
  native:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 85c70ad544f0409dc9051dde38c549530b2605ec
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: existing-editor-source
          path: .code-oss/prepared
      - run: tar -xzf .code-oss/prepared/existing-editor-source.tar.gz && mv editor-manifest.json .code-oss/prepared/
      - uses: ./.github/actions/setup-code-oss
        with:
          flavor: production
          arch: x64
      - name: Native Code-OSS interface check
        working-directory: .code-oss/source
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run typecheck-client
      - name: Preserve native runtime for focused UI repair
        run: tar -czf existing-editor-runtime.tar.gz -C .code-oss runtime
      - uses: actions/upload-artifact@v7
        with:
          name: existing-editor-runtime
          path: existing-editor-runtime.tar.gz
          retention-days: 3
          if-no-files-found: error
      - uses: ./.github/actions/setup-workspace
        with:
          scope: full
          electron: 'true'
      - name: Build integrated Synara
        run: bun run build:desktop
      - name: Prepare real desktop and sandbox helper
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb scrot ffmpeg libasound2t64 libgtk-3-0t64 libnss3 libgbm1 >/dev/null
          sandbox=$(realpath apps/desktop/node_modules/electron/dist/chrome-sandbox)
          sudo chown root:root "$sandbox" && sudo chmod 4755 "$sandbox"
      - name: Real Files route, editor, previews, chat and native services
        env:
          SYNARA_SMOKE_OUTPUT: .code-oss/screenshots
          SYNARA_VERIFY_MODAL: '1'
        run: xvfb-run -a -s '-screen 0 1440x1000x24' node apps/desktop/code-oss/scripts/smoke.mjs --appearance
      - name: Encode actual route switching
        run: ffmpeg -y -loglevel error -i .code-oss/screenshots/agent-ide-switch.mp4 -vf 'fps=8,scale=1000:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse' .code-oss/screenshots/existing-editor-switch.gif
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: existing-editor-evidence
          path: .code-oss/screenshots
          retention-days: 7
          if-no-files-found: warn
  blobs:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: existing-editor-source
      - name: Validate prepared source archive as data
        run: |
          python - <<'PY'
          import tarfile,pathlib
          with tarfile.open('existing-editor-source.tar.gz') as archive:
              for item in archive.getmembers():
                  p=pathlib.PurePosixPath(item.name)
                  if not item.isfile() or p.is_absolute() or '..' in p.parts or item.size>300000: raise ValueError('Unexpected source member')
              archive.extractall('source',filter='data')
          PY
      - name: Create content-addressed source blobs only
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('node:fs'),crypto=require('node:crypto');
            const manifest=JSON.parse(fs.readFileSync('source/editor-manifest.json','utf8'));
            if(!Array.isArray(manifest)||manifest.length!==27)throw Error('Unexpected manifest');
            const entries=[],seen=new Set();
            for(const item of manifest){
              if(!/^(apps|packages|scripts)\//.test(item.path)||item.path.includes('..')||seen.has(item.path))throw Error('Unexpected path');
              seen.add(item.path);
              const bytes=fs.readFileSync('source/'+item.path);
              if(crypto.createHash('sha256').update(bytes).digest('hex')!==item.sha256)throw Error('Source checksum mismatch');
              const {data}=await github.rest.git.createBlob({...context.repo,content:bytes.toString('base64'),encoding:'base64'});
              entries.push({...item,sha:data.sha,mode:'100644',type:'blob'});
            }
            fs.writeFileSync('existing-editor-blobs.json',JSON.stringify(entries,null,2));
      - uses: actions/upload-artifact@v7
        with:
          name: existing-editor-blobs
          path: existing-editor-blobs.json
          retention-days: 3
          if-no-files-found: error
